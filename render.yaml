services:
  - type: web
    name: meem-invitations
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/data.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/audio/*
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /admin
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /admin.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
