<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designs — MEEM • ميم</title>
<link rel="icon" type="image/svg+xml" href="assets/logos/meem-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  .controls { position: sticky; top: 69px; z-index: 50; background: rgba(255, 253, 249, 0.94); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 8px 30px rgba(45, 35, 20, 0.05); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1; min-width: 240px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid rgba(28, 25, 23, 0.14); border-radius: 14px; padding: 10px 14px; }
  .search:focus-within { border-color: var(--gold); }
  .search svg { color: var(--gold); flex-shrink: 0; }
  .search input { flex: 1; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .search input::placeholder { color: #8C847A; }
  .x { display: none; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(28, 25, 23, 0.10); color: #1C1917; cursor: pointer; }
  .x.on { display: inline-block; }
  .seg { display: inline-flex; background: #FFFFFF; border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button, .tab { border: 0; background: transparent; color: var(--muted); font: 600 12px inherit; font-family: inherit; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .seg button.active { background: var(--surface-2); color: var(--gold-2); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: #FFFFFF; }
  .tab:hover { color: var(--text); border-color: var(--gold-dim); }
  .tab.active { background: linear-gradient(135deg, #D4A754, #AA7D2A); color: #FFFFFF; border-color: transparent; }
  .count { font-size: 12px; color: var(--muted); margin-left: auto; }
  .cat-section { margin-top: 46px; }
  .cat-head { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .cat-head h2 { font-family: 'Cormorant Garamond',serif; font-size: 32px; font-weight: 500; }
  .cat-head .ar { color: var(--gold); font-family: 'Amiri',serif; font-size: 20px; margin-left: 8px; }
  .reel { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .reel input { accent-color: var(--gold); }
  @media (max-width: 680px) {
    .controls { top: 62px; padding: 12px; border-radius: 14px; }
    .search { width: 100%; min-width: 0; }
    .tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; white-space: nowrap; }
    .count { width: 100%; text-align: right; }
    .cat-head h2 { font-size: 26px; }
  }
</style>
</head>
<body>
<main class="container">
  <div class="page-head">
    <div class="crumbs"><a href="index.html">Home</a> / Designs</div>
    <h1 class="h1">The <em>Designs</em></h1>
    <p class="lead">23 designs across interactive experiences and quiet classic stationery cards.</p>
  </div>

  <div class="controls">
    <div class="row">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Search designs, city or venue…">
        <button class="x" id="x" aria-label="Clear">✕</button>
      </div>
      <label class="reel" title="Hide the back button for clean screen recordings"><input type="checkbox" id="clean"> Clean mode</label>
    </div>
    <div class="row"><div class="tabs" id="tabs"></div><div class="count" id="count"></div></div>
  </div>

  <div id="root" style="margin-bottom:40px"></div>
</main>
<script src="assets/data.js"></script><script src="assets/site.js"></script>
<script>
  Shell.init('collection.html');
  const S = SITE, root = document.getElementById('root'), q = document.getElementById('q'), x = document.getElementById('x');
  const params = new URLSearchParams(location.search);
  const st = { q: params.get('q') || '', cat: params.get('cat') || 'all' };
  q.value = st.q;

  document.getElementById('tabs').innerHTML =
    `<button class="tab" data-c="all">All (${S.SAMPLES.length})</button>` +
    S.CATEGORIES.map(c => `<button class="tab" data-c="${c.id}">${c.title.split(' & ')[0]} (${S.SAMPLES.filter(s=>s.cat===c.id).length})</button>`).join('');

  function ok(s) {
    if (st.cat !== 'all' && s.cat !== st.cat) return false;
    if (st.q) {
      const hay = [s.num, s.title, s.subtitle, s.venue, s.desc, ...s.features].join(' ').toLowerCase();
      return st.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
    }
    return true;
  }

  function render() {
    const list = S.SAMPLES.filter(ok);
    document.getElementById('count').textContent = `Showing ${list.length} of ${S.SAMPLES.length}`;
    x.classList.toggle('on', !!st.q);
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.c === st.cat));
    if (!list.length) {
      root.innerHTML = `<div class="empty-state" style="margin-top:40px"><h3 class="serif gold" style="font-size:30px;margin-bottom:8px">No matching designs</h3><p class="muted" style="font-size:14px;margin-bottom:16px">Try “Cairo”, “Katb Ketab”, “henna” or clear the filters.</p><button class="btn btn-gold" id="reset">Reset filters</button></div>`;
      document.getElementById('reset').onclick = () => { st.q = ''; st.cat = 'all'; q.value = ''; render(); };
      return;
    }
    root.innerHTML = S.CATEGORIES.filter(c => list.some(s => s.cat === c.id)).map(c => {
      const items = list.filter(s => s.cat === c.id);
      return `<section class="cat-section"><div class="cat-head"><h2>${c.title}<span class="ar">• ${c.ar}</span></h2><span class="badge">${items.length} design${items.length>1?'s':''}</span></div>
        <div class="gallery-grid">${items.map(Shell.cardMarkup).join('')}</div></section>`;
    }).join('');
  }

  q.addEventListener('input', () => { st.q = q.value.trim(); render(); });
  x.addEventListener('click', () => { q.value = ''; st.q = ''; render(); q.focus(); });
  document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { st.cat = b.dataset.c; render(); } });
  document.getElementById('langSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { st.lang = b.dataset.l; render(); } });
  document.getElementById('clean').addEventListener('change', e => { sessionStorage.setItem('clean', e.target.checked ? '1' : ''); });
  render();
</script>
</body></html>
