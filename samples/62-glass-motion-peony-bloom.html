<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youssef &amp; Lara — Blooming Peony &amp; Kinetic Levitating Glass | MEEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;
      background: #E8D6DC; display: flex; align-items: center; justify-content: center;
      padding: 28px 14px 68px; position: relative; overflow-x: hidden; cursor: pointer;
    }
    .bg-peony {
      position: fixed; inset: -6%;
      background: url('../assets/images/dusty-rose-floral.jpg') center/cover no-repeat;
      filter: brightness(0.88) saturate(1.14);
      animation: bgFloat 16s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes bgFloat { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.07) rotate(0.8deg); } }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }

    .kinetic-peony-card {
      position: relative; z-index: 3; width: min(374px, 100%);
      border-radius: 42px; padding: 34px 24px 26px; text-align: center; color: #3D1F28;
      background: linear-gradient(165deg, rgba(255,250,252,0.75) 0%, rgba(252,234,240,0.60) 52%, rgba(245,218,226,0.75) 100%);
      backdrop-filter: blur(22px) saturate(175%); -webkit-backdrop-filter: blur(22px) saturate(175%);
      border: 1.5px solid rgba(255,255,255,0.95);
      box-shadow: inset 0 2px 6px #fff, 0 32px 72px rgba(48,16,28,0.24);
      overflow: hidden;
      animation: levitate 5.4s ease-in-out infinite;
    }
    @keyframes levitate { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .kinetic-peony-card::before {
      content: ''; position: absolute; inset: 8px; border-radius: 34px;
      border: 1px solid rgba(186,118,138,0.34); pointer-events: none; z-index: 4;
    }
    .peony-corners {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: url('../assets/images/dusty-rose-floral.jpg') center/cover no-repeat;
      mix-blend-mode: multiply; opacity: 0.66;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 40%, #000 86%);
      mask-image: radial-gradient(circle at 50% 50%, transparent 40%, #000 86%);
    }
    .kinetic-peony-card > *:not(.peony-corners) { position: relative; z-index: 2; }
    .cameo-motion {
      width: 146px; height: 146px; margin: 12px auto; padding: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.88); border: 1.5px solid #fff;
      box-shadow: 0 12px 28px rgba(84,32,48,0.18); overflow: hidden;
    }
    .cameo-motion img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; animation: slowZoom 12s ease-in-out infinite alternate; }
    @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

    .motion-tabs { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,0.60); border: 1px solid rgba(186,118,138,0.32); margin-top: 12px; }
    .m-tab { padding: 7px 4px; border-radius: 999px; font-size: 10.5px; font-weight: 600; cursor: pointer; transition: all .25s ease; }
    .m-tab.active { background: #6E3044; color: #FFF8FA; box-shadow: 0 6px 14px rgba(110,48,68,0.28); }
    .btn-berry { width: 100%; padding: 11px 16px; border-radius: 999px; background: linear-gradient(135deg,#6E3044,#8F445C); color: #fff; font: 700 11px inherit; letter-spacing: .07em; text-transform: uppercase; border: 0; cursor: pointer; }
    .btn-outline { width: 100%; padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,0.72); color: #5C2C3C; font: 600 11px inherit; border: 1px solid rgba(186,118,138,0.42); text-decoration: none; display: inline-block; }
    .inp { width: 100%; padding: 9px 12px; border-radius: 11px; border: 1px solid rgba(143,68,92,0.34); background: rgba(255,255,255,0.80); color: #3D1F28; font: inherit; font-size: 12.5px; outline: none; margin-bottom: 8px; }
  </style>
  <style id="meem-mobile-fit">
  @media (max-width: 480px) {
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { max-width: 100vw; overflow-x: hidden; }

    /* Compact outer padding & card width so invitations breathe on mobile */
    body:not(:has(.story-frame)):not(:has(.video-hero)):not(:has(.reel-box)):not(:has(.poster)) {
      padding-left: 12px !important;
      padding-right: 12px !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .shell, .main,
    .watch-wrap, .card-wrap, .card-shell, .invite-shell, .stage, .accordion,
    .flip-wrap, .below, .arch-wrap, .glass-shell, .gala, .tile-frame, .body {
      max-width: min(346px, calc(100vw - 24px)) !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .main, .gala {
      padding-top: 18px !important;
      padding-bottom: 44px !important;
      padding-left: 4px !important;
      padding-right: 4px !important;
    }
    .shell, .arch-wrap {
      margin-top: 16px !important;
      margin-bottom: 44px !important;
      padding-left: 4px !important;
      padding-right: 4px !important;
    }

    /* Inner cards, arches & sections: refined padding & height */
    .arch-header, .watercolor-hero {
      padding: 28px 16px 22px !important;
      min-height: auto !important;
    }
    .section-block {
      padding: 22px 15px !important;
    }
    .card, .glass, .glass-card, .details-card, .hero-card, .venue-card, .panel {
      padding: 18px 15px !important;
      border-radius: 18px !important;
    }
    .ogee-card, .couture-card {
      padding: 28px 16px 22px !important;
      border-radius: 130px 130px 22px 22px !important;
    }
    .couture-card { border-radius: 22px !important; }
    .bifold-card .card-inner, .card-cover {
      padding: 26px 18px !important;
    }

    /* Liquid Glass series (60-65) */
    .glass-arch, .floral-glass-arch, .mihrab-card {
      width: min(338px, calc(100vw - 24px)) !important;
      min-height: 500px !important;
      padding: 32px 16px 20px !important;
      border-radius: 124px 124px 26px 26px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      inset: 6px !important;
      border-radius: 118px 118px 20px 20px !important;
    }
    .kinetic-peony-card {
      width: min(338px, calc(100vw - 24px)) !important;
      padding: 24px 16px 20px !important;
      border-radius: 32px !important;
    }
    .reel-frame, .cascade-frame {
      width: min(344px, calc(100vw - 20px)) !important;
      height: min(565px, calc(100dvh - 24px)) !important;
      min-height: 500px !important;
      padding: 14px 14px 16px !important;
      border-radius: 28px !important;
    }
    .workflow-stage-glass { padding: 16px 14px !important; border-radius: 22px !important; }
    .wf-card { padding: 10px 12px !important; margin-bottom: 8px !important; border-radius: 16px !important; }

    /* Full-bleed Video & Reel Heroes (51, 52, 55) */
    .story-frame { width: 100vw !important; height: 100vh !important; height: 100dvh !important; max-height: 100dvh !important; }
    .s-slide { padding: 22px 16px 68px !important; }
    .video-hero { height: 54vh !important; height: 54dvh !important; min-height: 310px !important; padding: 22px 14px !important; }
    .reel-box { height: 50vh !important; height: 50dvh !important; min-height: 290px !important; }
    .hero-wide { height: 220px !important; }
    .g-item { height: 225px !important; }

    /* Balanced Couple Titles & Headings on Mobile */
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(26px, 7.6vw, 32px) !important;
      line-height: 1.16 !important;
    }
    .gate-crest-wrap [data-couple-title], #cover-overlay [data-couple-title],
    .seal-gate [data-couple-title], .mihrab-seal [data-couple-title],
    .cover-names, .cover-title {
      font-size: clamp(22px, 6.6vw, 27px) !important;
    }
    .sec-title, .quote-text {
      font-size: clamp(19px, 5.5vw, 23px) !important;
    }
    .verse, .ayah, .month-poem {
      font-size: 15px !important;
      line-height: 1.75 !important;
    }
    .bronze-mono { font-size: 44px !important; }
    .spaced-date, .date-spaced { letter-spacing: 0.18em !important; font-size: 12px !important; }

    /* Proportioned Seals, Envelopes, Turntable, Watch Dial, Locket & Photos */
    .royal-seal, .wax-seal, .medallion, .wax-crystal, .pearl-medallion {
      width: 82px !important;
      height: 82px !important;
      margin-top: 12px !important;
      margin-bottom: 14px !important;
    }
    .medallion span, .wax-crystal span, .pearl-medallion span { font-size: 26px !important; }
    .cover-seal, .sculpt-mono {
      width: 66px !important;
      height: 66px !important;
      line-height: 66px !important;
      font-size: 22px !important;
      margin-bottom: 12px !important;
    }
    .envelope-stage { width: min(306px, 86vw) !important; height: 210px !important; }
    .envelope-letter { height: 176px !important; }
    .lace-env { width: min(296px, 86vw) !important; height: 208px !important; }
    .turntable { transform: scale(0.8); margin-bottom: 6px !important; }
    .dial-bezel { width: 204px !important; height: 204px !important; margin-bottom: 16px !important; }
    .locket-stage { transform: scale(0.82); margin: 0 auto 8px !important; }
    .venue-hero, .arch-frame, .venue-pic, .hero, .arch-photo, .arch-pic {
      height: 152px !important;
    }
    .arch-portrait { width: 134px !important; height: 166px !important; margin-bottom: 12px !important; }
    .cameo-motion { width: 118px !important; height: 118px !important; margin: 8px auto !important; }
    .couple-frame { width: 88px !important; height: 88px !important; margin-bottom: 10px !important; }
    .photo-frame, .photo-arch { height: 118px !important; margin-top: 9px !important; }
    .front-img { height: 205px !important; }

    /* Compact Countdowns, Date Strips & Buttons */
    .date-strip { gap: 10px !important; padding: 10px 14px !important; font-size: 16px !important; margin-top: 14px !important; }
    .date-pill { margin: 9px 0 !important; padding: 7px 11px !important; }
    .cd, .cd-grid, .countdown-grid, .cd-boxes, .cd-row {
      gap: 6px !important;
      max-width: 296px !important;
      margin: 10px auto 12px !important;
    }
    .cd div, .cd-item, .cd-box { padding: 7px 3px !important; border-radius: 10px !important; }
    .cd strong, .cd-num { font-size: 17px !important; }
    .open-btn, .cover-btn, .spin-btn { padding: 10px 22px !important; font-size: 12px !important; }
    .btn, .btn-pearl, .btn-glass, .btn-gold, .btn-outline, .btn-berry, .btn-pearl-ar, .btn-glass-ar, .tbtn {
      padding: 9px 13px !important;
      font-size: 11.5px !important;
      min-width: 0 !important;
    }
  }
</style>
</head>
<body data-music-mood="bridgerton_beckman" data-music-src="../assets/audio/bridgerton-beckman.mp3" data-particles="petals">
  <div class="bg-peony"></div>
  <article class="kinetic-peony-card" id="peonyCard">
    <div class="peony-corners"></div>
    <div style="font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#824357;">Blooming Peonies · Kinetic Glass</div>
    <div data-guest-name data-guest-prefix="Dearest " style="display:none;margin-top:3px;font-size:13px;color:#824357;"></div>
    <h1 class="serif" style="font-size:clamp(28px,7.8vw,44px);line-height:1.05;font-weight:600;margin-top:5px;" data-couple-title>Youssef &amp; Lara</h1>
    <p class="serif" style="font-style:italic;font-size:16px;color:#6E3B4B;margin-top:2px;">a celebration of love in motion</p>

    <div class="cameo-motion"><img data-couple-photo src="../assets/images/editorial-couple.jpg" alt="Youssef & Lara" /></div>

    <div style="padding:10px 14px;border-radius:16px;background:rgba(255,255,255,0.66);border:1px solid rgba(186,118,138,0.32);">
      <div class="serif" style="font-size:20px;font-weight:600;" data-venue-name>Four Seasons Nile Plaza</div>
      <div style="font-size:11px;color:#6E3B4B;"><span data-event-date>Saturday · 14 Dec 2027 · 7:30 PM</span> · <span data-table-seat>Rose Ballroom</span></div>
    </div>

    <div class="motion-tabs" id="mTabs">
      <div class="m-tab active" data-txt="7:30 PM · Violin strings &amp; rosewater welcome.">Welcome</div>
      <div class="m-tab" data-txt="8:30 PM · Floral aisle entrance &amp; first dance.">First Dance</div>
      <div class="m-tab" data-txt="10:00 PM · Candlelit gala dinner &amp; celebration.">Dinner</div>
    </div>
    <div id="mTabTxt" style="font-size:11.5px;color:#5C2C3C;margin:9px 0 12px;">7:30 PM · Violin strings &amp; rosewater welcome.</div>

    <form data-rsvp-form data-couple="Youssef & Lara" data-lang="en" data-result-target="rsvp-res">
      <input class="inp" name="guestName" required placeholder="Your Full Name for RSVP" />
      <div style="display:grid;grid-template-columns:1.25fr 0.95fr;gap:8px;">
        <button type="submit" class="btn-berry">Confirm RSVP</button>
        <a class="btn-outline" href="https://maps.google.com/?q=Four+Seasons+Hotel+Cairo+at+Nile+Plaza" target="_blank" rel="noopener">Garden Map ↗</a>
      </div>
    </form>
    <div id="rsvp-res" style="display:none;margin-top:10px;"></div>
  </article>
  <script src="../assets/shared.js"></script>
  <script>
    document.body.addEventListener('click', function () {
      try { WeddingSound.startMusic('bridgerton_beckman'); } catch (_) {}
    }, { once: true });
    document.getElementById('mTabs').addEventListener('click', function (e) {
      var t = e.target.closest('.m-tab'); if (!t) return;
      document.querySelectorAll('.m-tab').forEach(function (el) { el.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('mTabTxt').textContent = t.dataset.txt;
    });
  </script>
</body></html>
