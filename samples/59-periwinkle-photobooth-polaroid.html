<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malek &amp; Lina — Parisian Dusty-Blue Envelope &amp; Developing Polaroid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Courier+Prime:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue-hi: #95A7CA;
      --blue-mid: #7A8FB6;
      --blue-deep: #5E739B;
      --blush: #F7DCE3;
      --blush-hi: #FFF2F6;
      --rg-1: #AD7D64;
      --rg-2: #F2D6C3;
      --rg-3: #C99A82;
      --white: #FFFDFB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at 22% 16%, rgba(255, 242, 246, 0.22), transparent 50%),
        radial-gradient(circle at 82% 84%, rgba(56, 72, 108, 0.34), transparent 55%),
        linear-gradient(165deg, var(--blue-hi) 0%, var(--blue-mid) 48%, var(--blue-deep) 100%);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    /* Soft Linen Texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
      background-image: radial-gradient(rgba(255,255,255,0.5) 0.5px, transparent 0.5px);
      background-size: 14px 14px;
    }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .mono { font-family: 'Courier Prime', monospace; }

    /* ===== 3D UNFOLDING PARISIAN DUSTY-BLUE ENVELOPE + BLUSH SATIN BOW ===== */
    #env-cover {
      position: fixed;
      inset: 0;
      z-index: 5000;
      perspective: 1400px;
      background: linear-gradient(165deg, var(--blue-hi), var(--blue-mid) 52%, var(--blue-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 0.7s ease 0.72s, visibility 0.7s ease 0.72s;
    }
    #env-cover.is-open { opacity: 0; visibility: hidden; pointer-events: none; }
    .env-top-flap {
      position: absolute;
      inset: 0 0 48% 0;
      background: linear-gradient(180deg, #9EB0D2, #7F94BA);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      filter: drop-shadow(0 16px 26px rgba(42, 54, 84, 0.32));
      transition: transform 0.85s cubic-bezier(0.7, 0, 0.2, 1);
      z-index: 4;
    }
    .env-bot-flap {
      position: absolute;
      inset: 48% 0 0 0;
      background: linear-gradient(180deg, #7488AE, #5E739B);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      border-top: 1px solid rgba(255,255,255,0.22);
      transition: transform 0.85s cubic-bezier(0.7, 0, 0.2, 1);
      z-index: 2;
    }
    #env-cover.is-open .env-top-flap { transform: rotateX(168deg); }
    #env-cover.is-open .env-bot-flap { transform: translateY(38%); }

    #bloom-flash {
      position: fixed;
      inset: 0;
      z-index: 5100;
      background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #FFF0F5 55%, rgba(255,255,255,0.9) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s ease;
    }
    #bloom-flash.is-flashing { opacity: 0.92; }

    .bow-btn {
      position: relative;
      z-index: 10;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 8px;
      animation: bowBreath 3.2s ease-in-out infinite;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #env-cover.is-open .bow-btn { opacity: 0; transform: scale(1.2); }
    @keyframes bowBreath { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.04); } }
    .bow-svg { width: min(195px, 52vw); height: auto; filter: drop-shadow(0 18px 30px rgba(42, 54, 84, 0.38)); }
    .tap-seal-label {
      position: absolute;
      bottom: 48px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 253, 251, 0.95);
      z-index: 10;
      pointer-events: none;
    }

    /* ===== MAIN SAVE-THE-DATE CANVAS ===== */
    .wrap { position: relative; z-index: 2; max-width: 460px; margin: 0 auto; padding: 20px 18px 80px; text-align: center; }
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .lang-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      border-radius: 999px; background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.48); backdrop-filter: blur(10px);
      color: #FFFFFF; font: 700 11px inherit; letter-spacing: 0.12em; cursor: pointer;
    }
    .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--blush-hi); margin-bottom: 4px; }
    .couple-hero {
      font-size: clamp(46px, 12vw, 62px);
      font-style: italic;
      font-weight: 500;
      line-height: 1.08;
      color: #FFFFFF;
      text-shadow: 0 6px 22px rgba(42, 54, 84, 0.3);
      margin-bottom: 20px;
    }

    /* ===== METALLIC ROSE-GOLD PHOTOBOOTH SLOT & DEVELOPING POLAROID ===== */
    .booth-stage { width: min(312px, 88vw); margin: 0 auto 24px; position: relative; }
    .rose-slot {
      position: relative;
      z-index: 4;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--rg-2) 0%, var(--rg-3) 48%, var(--rg-1) 100%);
      box-shadow: 0 10px 24px rgba(42, 54, 84, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.9);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slot-led {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFF2F6;
      box-shadow: 0 0 8px #FFF2F6;
      flex-shrink: 0;
      animation: ledBlink 1.8s ease-in-out infinite;
    }
    @keyframes ledBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .rose-slot-mouth {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(180deg, #281D18, #4D3931);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    .polaroid-chute {
      overflow: hidden;
      margin: -6px auto 0;
      width: 88%;
      padding: 6px 8px 22px;
      position: relative;
      z-index: 2;
    }
    .polaroid-card {
      background: linear-gradient(180deg, #FFFFFF 0%, #F9F7F3 100%);
      padding: 13px 13px 22px;
      border-radius: 5px;
      box-shadow: 0 24px 48px rgba(42, 54, 84, 0.38);
      transform: translateY(-108%) rotate(0deg);
      transition: transform 2.2s cubic-bezier(0.22, 0.85, 0.32, 1);
    }
    .polaroid-card.is-printed {
      transform: translateY(0) rotate(-1.2deg);
    }
    .polaroid-frame {
      width: 100%;
      aspect-ratio: 4 / 4.35;
      overflow: hidden;
      background: #1B1B1F;
      position: relative;
    }
    /* Real Polaroid Chemical Developing Effect */
    .polaroid-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) brightness(2.2) contrast(0.55) blur(4px);
      transition: filter 2.4s ease 0.45s;
    }
    .polaroid-card.is-printed .polaroid-frame img {
      filter: grayscale(100%) contrast(1.12) brightness(1.02) blur(0px);
    }
    .polaroid-chin {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .polaroid-stamp { font-size: 13.5px; font-weight: 700; letter-spacing: 0.14em; color: #34343C; }
    .polaroid-heart { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #9A746A; font-weight: 700; }
    .reprint-btn {
      margin-top: -6px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px;
      border: 1px solid rgba(255, 242, 246, 0.55);
      background: rgba(255, 255, 255, 0.18);
      color: #FFFFFF; font: 600 10.5px inherit; letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    .reprint-btn:hover { background: rgba(255, 255, 255, 0.3); }

    /* ===== COLON COUNTDOWN ===== */
    .cd-block { opacity: 0; transform: translateY(14px); transition: opacity 0.8s ease, transform 0.8s ease; margin-bottom: 24px; }
    .cd-block.is-shown { opacity: 1; transform: translateY(0); }
    .cd-caption { font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--blush-hi); margin-bottom: 10px; }
    .cd-colon { display: inline-flex; align-items: flex-start; justify-content: center; gap: 8px; direction: ltr; }
    .cd-unit strong { display: block; font-size: 31px; font-weight: 700; line-height: 1; color: #FFFFFF; }
    .cd-unit span { display: block; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--blush-hi); margin-top: 5px; }
    .cd-sep { font-size: 26px; line-height: 1; color: var(--blush); font-weight: 700; }

    .glass-card {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 242, 246, 0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: 0 16px 36px rgba(42, 54, 84, 0.2);
    }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center;
      padding: 11px 16px; border-radius: 999px; font: 700 12px inherit;
      letter-spacing: 0.08em; text-transform: uppercase;
      text-decoration: none; cursor: pointer; border: 0;
    }
    .btn-blush { background: linear-gradient(135deg, var(--blush-hi), var(--blush)); color: #3D3546; box-shadow: 0 6px 16px rgba(42, 54, 84, 0.22); }
    .btn-glass { background: rgba(255, 255, 255, 0.2); color: #FFFFFF; border: 1px solid rgba(255, 242, 246, 0.5); }
    .inp {
      width: 100%; padding: 11px 14px; border-radius: 12px;
      border: 1px solid rgba(255, 242, 246, 0.55); background: rgba(255, 255, 255, 0.92);
      color: #2C3448; font: inherit; font-size: 13.5px; margin-bottom: 10px;
    }
  </style>

    /* Full-bleed Video & Reel Heroes (51, 52, 55) */

  <!-- 3D Unfolding Parisian Dusty-Blue Envelope + Blush Satin Bow -->

    <div class="env-bot-flap" aria-hidden="true"></div>

    <button type="button" class="bow-btn" id="openBowBtn" aria-label="Open Save the Date">
      <svg class="bow-svg" viewBox="0 0 220 175" fill="none">
        <defs>
          <linearGradient id="blushL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFF5F8"/>

            <stop offset="100%" stop-color="#D7A5B4"/>

          <linearGradient id="blushR" x1="1" y1="0" x2="0" y2="1">

  <main class="wrap">

    </section>

    <section class="glass-card">
      <div style="font-size:10.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--blush-hi);margin-bottom:6px;" id="venueKicker">THE CELEBRATION</div>
      <div class="serif" style="font-size:26px;font-style:italic;" data-venue-name>Sofitel Cairo Nile El Gezirah · Zamalek</div>
      <div style="font-size:12.5px;opacity:0.92;margin-top:4px;" data-table-seat>Nile Promenade · Table 03 · 7:00 PM</div>
      <div class="btn-row">
        <button type="button" class="btn btn-blush" id="calBtn" onclick="WeddingCalendar.openGoogleCalendar(EVENT_INFO)">Save the Date</button>
        <a class="btn btn-glass" id="mapBtn" href="https://maps.google.com/?q=Sofitel+Cairo+Nile+El+Gezirah" target="_blank" rel="noopener">Venue Map</a>
      </div>
    </section>

    <section class="glass-card">
      <div class="serif" style="font-size:25px;font-style:italic;margin-bottom:10px;" id="rsvpHead">Will You Celebrate With Us?</div>
      <form data-rsvp-form data-couple="Malek & Lina" data-lang="en" data-result-target="rsvp-res">
        <input class="inp" id="guestInput" name="guestName" type="text" required placeholder="Your Name" />
        <button type="submit" class="btn btn-blush" id="rsvpBtn" style="width:100%;">Confirm on WhatsApp</button>
      </form>
      <div id="rsvp-res" style="display:none;margin-top:10px;"></div>
    </section>
  </main>

  <script src="../assets/shared.js"></script>
  <script>
    const EVENT_INFO = { title: 'Malek & Lina Save the Date', start: '2027-05-25T17:00:00Z', end: '2027-05-25T23:00:00Z', location: 'Sofitel Cairo Nile El Gezirah, Zamalek' };
    const cover = document.getElementById('env-cover');
    const flash = document.getElementById('bloom-flash');
    const polaroid = document.getElementById('polaroidCard');
    const cdBlock = document.getElementById('cdBlock');

    function runPolaroidPrint() {
      polaroid.classList.remove('is-printed');
      void polaroid.offsetWidth;
      setTimeout(() => polaroid.classList.add('is-printed'), 160);
    }

    function openEnvelope() {
      cover.classList.add('is-open');
      try { WeddingSound.startMusic('golden_hour'); } catch (_) {}
      setTimeout(() => flash.classList.add('is-flashing'), 420);
      setTimeout(() => {
        document.body.classList.remove('wi-scroll-locked');
        flash.classList.remove('is-flashing');
        runPolaroidPrint();
      }, 760);
      setTimeout(() => cdBlock.classList.add('is-shown'), 1900);
    }

    cover.addEventListener('click', openEnvelope);
    document.getElementById('reprintBtn').addEventListener('click', runPolaroidPrint);

    let isAr = false;
    document.getElementById('langToggle').addEventListener('click', () => {
      isAr = !isAr;
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      document.getElementById('kickerText').textContent = isAr ? 'يسعدنا دعوتكم لليلة العمر' : "WE'RE GETTING MARRIED";
      document.getElementById('saveStamp').textContent = isAr ? 'احفظ التاريخ' : 'SAVE THE DATE';
      document.getElementById('reprintBtn').textContent = isAr ? 'إعادة طباعة الصورة' : 'Reprint Polaroid';
      document.getElementById('cdCaption').textContent = isAr ? 'العد التنازلي للحظة المنتظرة' : 'COUNTING DOWN THE MOMENTS';
      document.getElementById('lblDays').textContent = isAr ? 'يوم' : 'Days';
      document.getElementById('lblHours').textContent = isAr ? 'ساعة' : 'Hours';
      document.getElementById('lblMins').textContent = isAr ? 'دقيقة' : 'Mins';
      document.getElementById('lblSecs').textContent = isAr ? 'ثانية' : 'Secs';
      document.getElementById('venueKicker').textContent = isAr ? 'تفاصيل الاحتفال' : 'THE CELEBRATION';
      document.getElementById('calBtn').textContent = isAr ? 'إضافة للتقويم' : 'Save the Date';
      document.getElementById('mapBtn').textContent = isAr ? 'موقع الحفل' : 'Venue Map';
      document.getElementById('rsvpHead').textContent = isAr ? 'هل ستشاركوننا فرحتنا؟' : 'Will You Celebrate With Us?';
      document.getElementById('guestInput').placeholder = isAr ? 'الاسم الكريم' : 'Your Name';
      document.getElementById('rsvpBtn').textContent = isAr ? 'تأكيد الحضور عبر واتساب' : 'Confirm on WhatsApp';
    });
  </script>
</body>
</html>
