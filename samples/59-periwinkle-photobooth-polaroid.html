<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malek &amp; Lina — Periwinkle Ribbon Envelope &amp; Photobooth Polaroid Save the Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Courier+Prime:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --peri: #A9B8DF;
      --peri-light: #BDC9EA;
      --peri-deep: #8E9FCA;
      --blush: #F6D8E0;
      --blush-hi: #FDEEF2;
      --blush-shadow: #DFB3BF;
      --rose-gold-1: #B88E76;
      --rose-gold-2: #E8CAB6;
      --rose-gold-3: #C9A089;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.22), transparent 50%),
        radial-gradient(circle at 80% 85%, rgba(124,142,190,0.28), transparent 55%),
        linear-gradient(165deg, var(--peri-light) 0%, var(--peri) 52%, var(--peri-deep) 100%);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    /* Subtle matte cotton-paper grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
      background-image: radial-gradient(rgba(255,255,255,0.45) 0.6px, transparent 0.6px), radial-gradient(rgba(74,90,132,0.25) 0.6px, transparent 0.6px);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .mono { font-family: 'Courier Prime', monospace; }
    .ar-font { font-family: 'Amiri', serif; }

    /* ===== FULL-SCREEN PERIWINKLE 4-FLAP ENVELOPE + BLUSH SATIN BOW ===== */
    #env-cover {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: linear-gradient(160deg, var(--peri-light), var(--peri) 55%, var(--peri-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 0.65s ease 0.35s, visibility 0.65s ease 0.35s;
    }
    #env-cover.is-open { opacity: 0; visibility: hidden; pointer-events: none; }
    .env-folds {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .env-folds svg { width: 100%; height: 100%; display: block; }

    /* Luminous white-blush flash bloom on tap */
    #bloom-flash {
      position: fixed;
      inset: 0;
      z-index: 5100;
      background: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #FDEEF2 55%, rgba(255,255,255,0.92) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.42s ease;
    }
    #bloom-flash.is-flashing { opacity: 1; }

    /* Realistic 3D Blush Satin Ribbon Bow */
    .bow-btn {
      position: relative;
      z-index: 10;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 10px;
      animation: bowFloat 3.4s ease-in-out infinite;
      transition: transform 0.35s ease;
    }
    .bow-btn:hover { transform: scale(1.06); }
    @keyframes bowFloat { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.03); } }
    .bow-svg {
      width: min(210px, 56vw);
      height: auto;
      filter: drop-shadow(0 18px 28px rgba(72, 86, 126, 0.34));
    }
    .tap-seal-label {
      position: absolute;
      bottom: 46px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 2px 10px rgba(72, 86, 126, 0.35);
      pointer-events: none;
    }

    /* ===== MAIN SAVE-THE-DATE CANVAS ===== */
    .wrap {
      position: relative;
      z-index: 2;
      max-width: 460px;
      margin: 0 auto;
      padding: 20px 18px 80px;
      text-align: center;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }
    .lang-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      color: #FFFFFF;
      font: 700 11px inherit;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .lang-pill:hover { background: rgba(255, 255, 255, 0.36); }

    .kicker {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 4px;
    }
    .couple-hero {
      font-size: clamp(46px, 12vw, 62px);
      font-style: italic;
      font-weight: 500;
      line-height: 1.08;
      color: #FFFFFF;
      text-shadow: 0 4px 18px rgba(72, 86, 126, 0.25);
      margin-bottom: 22px;
    }

    /* ===== METALLIC ROSE-GOLD PHOTOBOOTH SLOT & PRINTING POLAROID ===== */
    .booth-stage {
      width: min(306px, 86vw);
      margin: 0 auto 24px;
      position: relative;
    }
    .rose-slot {
      position: relative;
      z-index: 4;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--rose-gold-2) 0%, var(--rose-gold-3) 48%, var(--rose-gold-1) 100%);
      box-shadow:
        0 8px 20px rgba(72, 86, 126, 0.3),
        inset 0 1px 2px rgba(255, 255, 255, 0.85),
        inset 0 -2px 4px rgba(84, 52, 36, 0.35);
      padding: 5px 14px;
      display: flex;
      align-items: center;
    }
    .rose-slot-mouth {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(180deg, #3A2A24, #59443B);
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.7);
    }
    .polaroid-chute {
      overflow: hidden;
      margin: -6px auto 0;
      width: 88%;
      padding: 6px 6px 20px;
      position: relative;
      z-index: 2;
    }
    .polaroid-card {
      background: linear-gradient(180deg, #FFFFFF 0%, #F8F7F4 100%);
      padding: 13px 13px 22px;
      border-radius: 4px;
      box-shadow: 0 22px 44px rgba(62, 76, 118, 0.32), 0 4px 10px rgba(0, 0, 0, 0.08);
      transform: translateY(-108%);
      transition: transform 2.1s cubic-bezier(0.22, 0.85, 0.32, 1);
    }
    .polaroid-card.is-printed {
      transform: translateY(0);
    }
    .polaroid-frame {
      width: 100%;
      aspect-ratio: 4 / 4.35;
      overflow: hidden;
      background: #1C1C1E;
      position: relative;
    }
    .polaroid-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(1.12) brightness(1.02);
    }
    .polaroid-chin {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      color: #46424A;
    }
    .polaroid-stamp {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #3A373E;
    }
    .polaroid-heart {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9A7D74;
      font-weight: 600;
    }
    .reprint-btn {
      margin-top: -6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
      font: 600 10.5px inherit;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .reprint-btn:hover { background: rgba(255, 255, 255, 0.3); }

    /* ===== COLON-SEPARATED EDITORIAL COUNTDOWN ===== */
    .cd-block {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      margin-bottom: 24px;
    }
    .cd-block.is-shown { opacity: 1; transform: translateY(0); }
    .cd-caption {
      font-size: 10.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.86);
      margin-bottom: 10px;
    }
    .cd-colon {
      display: inline-flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      direction: ltr;
    }
    .cd-unit strong {
      display: block;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      color: #FFFFFF;
      letter-spacing: 0.04em;
    }
    .cd-unit span {
      display: block;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      margin-top: 5px;
    }
    .cd-sep {
      font-size: 26px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.72);
      font-weight: 700;
    }

    /* ===== FROSTED DETAILS & RSVP CARDS ===== */
    .glass-card {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: 0 14px 34px rgba(72, 86, 126, 0.16);
    }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center;
      padding: 11px 16px; border-radius: 999px; font: 700 12px inherit;
      letter-spacing: 0.08em; text-transform: uppercase;
      text-decoration: none; cursor: pointer; border: 0;
    }
    .btn-blush { background: linear-gradient(135deg, var(--blush-hi), var(--blush)); color: #4A3E4C; box-shadow: 0 6px 16px rgba(72, 86, 126, 0.2); }
    .btn-glass { background: rgba(255, 255, 255, 0.22); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.48); }
    .inp {
      width: 100%; padding: 11px 14px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.9);
      color: #2E3446; font: inherit; font-size: 13.5px; margin-bottom: 10px;
    }
  </style>
</head>
<body class="wi-scroll-locked" data-music-mood="golden_hour" data-particles="gold-dust">
  <div id="bloom-flash" aria-hidden="true"></div>

  <!-- Full-Screen Periwinkle Envelope with Blush Satin Bow -->
  <div id="env-cover" role="dialog" aria-label="Tap the Blush Satin Bow to Open">
    <div class="env-folds" aria-hidden="true">
      <svg viewBox="0 0 400 800" preserveAspectRatio="none">
        <polygon points="0,0 400,0 200,400" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.34)" stroke-width="1.2"/>
        <polygon points="0,800 400,800 200,400" fill="rgba(88,104,148,0.14)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/>
        <polygon points="0,0 0,800 200,400" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
        <polygon points="400,0 400,800 200,400" fill="rgba(88,104,148,0.08)" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
      </svg>
    </div>

    <button type="button" class="bow-btn" id="openBowBtn" aria-label="Open Save the Date">
      <svg class="bow-svg" viewBox="0 0 220 175" fill="none">
        <defs>
          <linearGradient id="blushL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFF4F7"/>
            <stop offset="55%" stop-color="#F6D8E0"/>
            <stop offset="100%" stop-color="#D9A8B6"/>
          </linearGradient>
          <linearGradient id="blushR" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF4F7"/>
            <stop offset="55%" stop-color="#F6D8E0"/>
            <stop offset="100%" stop-color="#D9A8B6"/>
          </linearGradient>
        </defs>
        <!-- Ribbon Tails -->
        <path d="M104 82 C88 112 72 136 52 162 L76 154 L88 168 C98 140 106 114 110 86 Z" fill="url(#blushL)" stroke="#E5BCC8" stroke-width="1"/>
        <path d="M116 82 C132 112 148 136 168 162 L144 154 L132 168 C122 140 114 114 110 86 Z" fill="url(#blushR)" stroke="#E5BCC8" stroke-width="1"/>
        <!-- Left & Right Satin Loops -->
        <path d="M104 72 C76 26 24 22 18 58 C12 92 64 98 104 80 Z" fill="url(#blushL)" stroke="#FDEEF2" stroke-width="1.4"/>
        <path d="M116 72 C144 26 196 22 202 58 C208 92 156 98 116 80 Z" fill="url(#blushR)" stroke="#FDEEF2" stroke-width="1.4"/>
        <!-- Inner Loop Fold Shadows -->
        <path d="M98 76 C70 54 44 58 38 70 C54 78 78 82 98 76 Z" fill="rgba(196,136,154,0.34)"/>
        <path d="M122 76 C150 54 176 58 182 70 C166 78 142 82 122 76 Z" fill="rgba(196,136,154,0.34)"/>
        <!-- Center Satin Knot -->
        <rect x="96" y="58" width="28" height="28" rx="11" fill="url(#blushL)" stroke="#FFF6F9" stroke-width="1.4"/>
      </svg>
    </button>
    <div class="tap-seal-label" id="sealPrompt">TAP THE SEAL TO OPEN</div>
  </div>

  <!-- Main Periwinkle Photobooth Save-the-Date -->
  <main class="wrap">
    <div class="top-bar">
      <button type="button" class="lang-pill" id="langToggle">AR / EN</button>
    </div>

    <div class="kicker" id="kickerText">WE'RE GETTING MARRIED</div>
    <h1 class="serif couple-hero" data-couple-title>Malek &amp; Lina</h1>

    <!-- Metallic Rose-Gold Photobooth Slot + Printing Polaroid -->
    <section class="booth-stage">
      <div class="rose-slot" aria-hidden="true">
        <div class="rose-slot-mouth"></div>
      </div>
      <div class="polaroid-chute">
        <div class="polaroid-card" id="polaroidCard">
          <div class="polaroid-frame">
            <img data-couple-photo src="../assets/images/polaroid-couple.jpg" alt="Couple Black and White Polaroid" />
          </div>
          <div class="polaroid-chin">
            <span class="mono polaroid-stamp" data-event-date>05 / 25 / 2027</span>
            <span class="polaroid-heart" id="saveStamp">SAVE THE DATE</span>
          </div>
        </div>
      </div>
      <button type="button" class="reprint-btn" id="reprintBtn">Reprint Polaroid</button>
    </section>

    <!-- Colon-Separated Live Countdown -->
    <section class="cd-block" id="cdBlock">
      <div class="cd-caption" id="cdCaption">COUNTING DOWN THE MOMENTS</div>
      <div class="cd-colon mono" data-countdown="2027-05-25T19:00:00+02:00">
        <div class="cd-unit"><strong data-cd="days">00</strong><span id="lblDays">Days</span></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><strong data-cd="hours">00</strong><span id="lblHours">Hours</span></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><strong data-cd="minutes">00</strong><span id="lblMins">Mins</span></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><strong data-cd="seconds">00</strong><span id="lblSecs">Secs</span></div>
      </div>
    </section>

    <section class="glass-card">
      <div style="font-size:10.5px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.86;margin-bottom:6px;" id="venueKicker">THE CELEBRATION</div>
      <div class="serif" style="font-size:26px;font-style:italic;" data-venue-name>Sofitel Cairo Nile El Gezirah · Zamalek</div>
      <div style="font-size:12.5px;opacity:0.9;margin-top:4px;" data-table-seat>Nile Promenade · Table 03 · 7:00 PM</div>
      <div class="btn-row">
        <button type="button" class="btn btn-blush" id="calBtn" onclick="WeddingCalendar.openGoogleCalendar(EVENT_INFO)">Save the Date</button>
        <a class="btn btn-glass" id="mapBtn" href="https://maps.google.com/?q=Sofitel+Cairo+Nile+El+Gezirah" target="_blank" rel="noopener">Venue Map</a>
      </div>
    </section>

    <section class="glass-card">
      <div class="serif" style="font-size:25px;font-style:italic;margin-bottom:10px;" id="rsvpHead">Will You Celebrate With Us?</div>
      <form data-rsvp-form data-couple="Malek & Lina" data-lang="en" data-result-target="rsvp-res">
        <input class="inp" id="guestInput" name="guestName" type="text" required placeholder="Your Name" />
        <button type="submit" class="btn btn-blush" id="rsvpBtn" style="width:100%;">Confirm on WhatsApp</button>
      </form>
      <div id="rsvp-res" style="display:none;margin-top:10px;"></div>
    </section>
  </main>

  <script src="../assets/shared.js"></script>
  <script>
    const EVENT_INFO = { title: 'Malek & Lina Save the Date', start: '2027-05-25T17:00:00Z', end: '2027-05-25T23:00:00Z', location: 'Sofitel Cairo Nile El Gezirah, Zamalek' };
    const cover = document.getElementById('env-cover');
    const flash = document.getElementById('bloom-flash');
    const polaroid = document.getElementById('polaroidCard');
    const cdBlock = document.getElementById('cdBlock');

    function runPolaroidPrint() {
      polaroid.classList.remove('is-printed');
      void polaroid.offsetWidth;
      setTimeout(() => polaroid.classList.add('is-printed'), 160);
    }

    function openEnvelope() {
      flash.classList.add('is-flashing');
      try { WeddingSound.startMusic('golden_hour'); } catch (_) {}
      setTimeout(() => {
        cover.classList.add('is-open');
        document.body.classList.remove('wi-scroll-locked');
      }, 220);
      setTimeout(() => {
        flash.classList.remove('is-flashing');
        runPolaroidPrint();
      }, 520);
      setTimeout(() => cdBlock.classList.add('is-shown'), 1650);
    }

    cover.addEventListener('click', openEnvelope);
    document.getElementById('reprintBtn').addEventListener('click', runPolaroidPrint);

    let isAr = false;
    document.getElementById('langToggle').addEventListener('click', () => {
      isAr = !isAr;
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      document.getElementById('kickerText').textContent = isAr ? 'يسعدنا دعوتكم لليلة العمر' : "WE'RE GETTING MARRIED";
      document.getElementById('saveStamp').textContent = isAr ? 'احفظ التاريخ' : 'SAVE THE DATE';
      document.getElementById('reprintBtn').textContent = isAr ? 'إعادة طباعة الصورة' : 'Reprint Polaroid';
      document.getElementById('cdCaption').textContent = isAr ? 'العد التنازلي للحظة المنتظرة' : 'COUNTING DOWN THE MOMENTS';
      document.getElementById('lblDays').textContent = isAr ? 'يوم' : 'Days';
      document.getElementById('lblHours').textContent = isAr ? 'ساعة' : 'Hours';
      document.getElementById('lblMins').textContent = isAr ? 'دقيقة' : 'Mins';
      document.getElementById('lblSecs').textContent = isAr ? 'ثانية' : 'Secs';
      document.getElementById('venueKicker').textContent = isAr ? 'تفاصيل الاحتفال' : 'THE CELEBRATION';
      document.getElementById('calBtn').textContent = isAr ? 'إضافة للتقويم' : 'Save the Date';
      document.getElementById('mapBtn').textContent = isAr ? 'موقع الحفل' : 'Venue Map';
      document.getElementById('rsvpHead').textContent = isAr ? 'هل ستشاركوننا فرحتنا؟' : 'Will You Celebrate With Us?';
      document.getElementById('guestInput').placeholder = isAr ? 'الاسم الكريم' : 'Your Name';
      document.getElementById('rsvpBtn').textContent = isAr ? 'تأكيد الحضور عبر واتساب' : 'Confirm on WhatsApp';
    });
  </script>
</body>
</html>
