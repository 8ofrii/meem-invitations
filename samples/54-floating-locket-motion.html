<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tamer &amp; Hana — 3D Floating Gold Locket Motion | Nile Plaza</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#161014;--rose:#E6B8A2;--gold:#E5C278;--ivory:#FFF8F3}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:radial-gradient(circle at 50% 20%,#2E1C26,#0E090C 75%);color:var(--ivory);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding:24px 14px 60px;text-align:center;position:relative;overflow-x:hidden}
    .bg-vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;filter:sepia(.25) brightness(.8);z-index:0;pointer-events:none}
    .shell{max-width:480px;margin:0 auto;position:relative;z-index:2}
    .serif{font-family:'Cormorant Garamond',serif}
    .locket-stage{perspective:1100px;margin:14px auto 26px;width:230px;height:270px;cursor:pointer;position:relative}
    .locket-stage::before{content:'';position:absolute;inset:-14px;border-radius:134px;border:1px solid rgba(229,194,120,.38);animation:haloPulse 3.2s ease-in-out infinite;pointer-events:none}
    @keyframes haloPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.06);opacity:.9}}
    .locket-body{width:100%;height:100%;border-radius:120px;border:5px solid var(--gold);overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.65),0 0 40px rgba(229,194,120,.2);animation:floatLocket 4s ease-in-out infinite}
    @keyframes floatLocket{0%,100%{transform:translateY(0) rotateY(-6deg)}50%{transform:translateY(-10px) rotateY(6deg)}}
    .locket-body img{width:100%;height:100%;object-fit:cover}
    .locket-lid{position:absolute;inset:0;background:linear-gradient(145deg,#3A212C,#1C0E15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;transform-origin:left center;transition:transform 1s cubic-bezier(.76,0,.24,1);border-radius:115px}
    .locket-stage.is-open .locket-lid{transform:rotateY(-135deg);opacity:0;pointer-events:none}
    .card{background:rgba(255,248,243,.06);border:1px solid rgba(229,194,120,.32);border-radius:22px;padding:22px 18px;backdrop-filter:blur(12px)}
    .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
    .cd div{background:rgba(229,194,120,.1);border-radius:12px;padding:9px 4px}
    .cd strong{display:block;font-size:21px;color:var(--gold)} .cd span{font-size:9.5px;text-transform:uppercase;color:#D4BFC6}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border-radius:999px;font:600 12.5px inherit;border:0;cursor:pointer;text-decoration:none}
    .btn-g{background:linear-gradient(135deg,var(--gold),var(--rose));color:#1A0D12} .btn-o{border:1px solid var(--gold);color:var(--gold);background:transparent}
    .inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(229,194,120,.32);background:rgba(255,255,255,.07);color:#fff;font:inherit;margin-bottom:10px}
  </style>
  <style id="meem-mobile-fit">
  /* Universal Full-Screen Mobile & Cross-Device Responsive Scaling */
  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: clip !important;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  /* Responsive Full-Screen Mobile (phones & phablets up to 640px) */
  @media (max-width: 640px) {
    body {
      padding: 10px 8px 36px !important;
    }
    body:has(.story-frame), body:has(.reel-frame), body:has(.cascade-frame),
    body:has(.video-hero), body:has(.reel-box), body:has(.poster) {
      padding: 0 !important;
    }

    /* Fill full mobile width cleanly — never shrink to a tiny centered box */
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .shell, .main,
    .watch-wrap, .card-wrap, .card-shell, .invite-shell, .stage, .accordion,
    .flip-wrap, .below, .arch-wrap, .glass-shell, .gala, .tile-frame, .body {
      width: 100% !important;
      max-width: 100% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .main, .gala {
      padding-top: 12px !important;
      padding-bottom: 42px !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }
    .shell, .arch-wrap {
      margin-top: 8px !important;
      margin-bottom: 36px !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }

    /* Inner cards & sections: balanced breathing room */
    .arch-header, .watercolor-hero {
      padding: 32px 18px 24px !important;
      min-height: auto !important;
    }
    .section-block { padding: 24px 16px !important; }
    .card, .glass, .glass-card, .details-card, .hero-card, .venue-card, .panel {
      padding: 20px 16px !important;
      border-radius: 20px !important;
    }
    .ogee-card {
      width: 100% !important;
      padding: 32px 18px 24px !important;
      border-radius: 140px 140px 24px 24px !important;
    }
    .couture-card {
      width: 100% !important;
      padding: 28px 18px 24px !important;
      border-radius: 24px !important;
    }
    .bifold-card .card-inner, .card-cover { padding: 28px 18px !important; }

    /* Liquid Glass Arches & Peony (60, 61, 62, 65): full-screen presence on mobile */
    .glass-arch, .floral-glass-arch, .mihrab-card {
      width: 100% !important;
      max-width: 100% !important;
      min-height: calc(100dvh - 20px) !important;
      padding: 36px 20px 26px !important;
      border-radius: 150px 150px 28px 28px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      inset: 7px !important;
      border-radius: 143px 143px 21px 21px !important;
    }
    .kinetic-peony-card {
      width: 100% !important;
      max-width: 100% !important;
      min-height: calc(100dvh - 20px) !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      padding: 30px 20px 24px !important;
      border-radius: 34px !important;
    }

    /* Full-Bleed Edge-to-Edge Video & Workflow Reels (63, 64, 55) on Mobile */
    .reel-frame, .cascade-frame {
      width: 100vw !important;
      max-width: 100vw !important;
      min-height: 100dvh !important;
      height: auto !important;
      border-radius: 0 !important;
      border: 0 !important;
      padding: 20px 16px 32px !important;
    }
    .story-frame {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100dvh !important;
      min-height: 100dvh !important;
      border-radius: 0 !important;
    }
    .s-slide { padding: 24px 18px 72px !important; }
    .video-hero { height: 58dvh !important; min-height: 340px !important; padding: 24px 16px !important; }
    .reel-box { height: 54dvh !important; min-height: 320px !important; }
    .hero-wide { height: 240px !important; }
    .g-item { height: 240px !important; }

    /* Grand, Readable Couple Titles & Typography on Full-Screen Mobile */
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(30px, 8.8vw, 42px) !important;
      line-height: 1.15 !important;
    }
    .gate-crest-wrap [data-couple-title], #cover-overlay [data-couple-title],
    .seal-gate [data-couple-title], .mihrab-seal [data-couple-title],
    .flow-gate [data-couple-title], .cover-names, .cover-title {
      font-size: clamp(28px, 8vw, 38px) !important;
    }
    .sec-title, .quote-text { font-size: clamp(22px, 6vw, 28px) !important; }
    .verse, .ayah, .month-poem { font-size: clamp(15px, 4.2vw, 18px) !important; line-height: 1.78 !important; }

    /* Well-Proportioned Interactive Elements */
    .royal-seal, .wax-seal, .medallion, .wax-crystal, .pearl-medallion, .flow-orb {
      width: clamp(86px, 24vw, 108px) !important;
      height: clamp(86px, 24vw, 108px) !important;
    }
    .envelope-stage, .lace-env { width: min(360px, 92vw) !important; height: auto !important; min-height: 224px !important; }
    .dial-bezel { width: min(240px, 68vw) !important; height: min(240px, 68vw) !important; }
    .photo-frame, .photo-arch { height: clamp(140px, 36vw, 185px) !important; }
    .cameo-motion { width: clamp(128px, 34vw, 156px) !important; height: clamp(128px, 34vw, 156px) !important; }
    .cd, .cd-grid, .countdown-grid, .cd-boxes, .cd-row {
      width: 100% !important;
      max-width: 100% !important;
      gap: 8px !important;
    }
    .btn, .btn-pearl, .btn-glass, .btn-gold, .btn-outline, .btn-berry, .btn-pearl-ar, .btn-glass-ar, .tbtn {
      padding: 11px 16px !important;
      font-size: 13px !important;
    }
  }

  /* Compact Extra-Small Viewport (e.g. inside 350px desktop preview phone iframe) */
  @media (max-width: 375px) {
    .glass-arch, .floral-glass-arch, .mihrab-card {
      padding: 28px 15px 20px !important;
      border-radius: 120px 120px 24px 24px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      border-radius: 113px 113px 17px 17px !important;
    }
    .kinetic-peony-card { padding: 22px 15px 18px !important; border-radius: 28px !important; }
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(26px, 8vw, 34px) !important;
    }
    .photo-frame, .photo-arch { height: 126px !important; }
    .cameo-motion { width: 116px !important; height: 116px !important; }
  }
</style>
</head>
<body data-music-mood="a_thousand_years" data-particles="gold-dust">
  <video class="bg-vid" autoplay muted loop playsinline poster="../assets/images/four-seasons-nile.jpg" aria-hidden="true">
    <source src="../assets/video/wedding-intro-loop.mp4" type="video/mp4" />
  </video>
  <main class="shell">
    <div style="font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);">Tap the Golden Locket to Open</div>
    <div class="locket-stage" id="locket">
      <div class="locket-body">
        <img data-couple-photo src="../assets/images/polaroid-couple.jpg" alt="Couple Inside Locket" />
        <div class="locket-lid">
          <div class="serif" style="font-size:34px;color:var(--gold);" data-monogram>T &amp; H</div>
          <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-top:8px;">Open Locket</div>
        </div>
      </div>
    </div>
    <div class="card">
      <h1 class="serif" style="font-size:clamp(28px,7.8vw,44px);color:var(--gold);" data-couple-title>Tamer &amp; Hana</h1>
      <div style="font-size:13px;color:#E2CDD4;margin:6px 0 4px;" data-event-date>Friday, December 17, 2027 · 8:00 PM</div>
      <div style="font-size:12px;color:#C4ABB4;" data-venue-name>Four Seasons Hotel Cairo at Nile Plaza</div>
      <div class="cd" data-countdown="2027-12-17T20:00:00+02:00">
        <div><strong data-cd="days">00</strong><span>Days</span></div>
        <div><strong data-cd="hours">00</strong><span>Hours</span></div>
        <div><strong data-cd="minutes">00</strong><span>Mins</span></div>
        <div><strong data-cd="seconds">00</strong><span>Secs</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:18px;">
        <button type="button" class="btn btn-g" style="flex:1" onclick="WeddingCalendar.openGoogleCalendar(EVENT_INFO)">Save Date</button>
        <a class="btn btn-o" style="flex:1" href="https://maps.google.com/?q=Four+Seasons+Hotel+Cairo+at+Nile+Plaza" target="_blank" rel="noopener">Venue Map</a>
      </div>
      <form data-rsvp-form data-couple="Tamer & Hana" data-lang="en" data-result-target="rsvp-res">
        <input class="inp" name="guestName" type="text" required placeholder="Your Name" />
        <button type="submit" class="btn btn-g" style="width:100%;">Confirm Attendance on WhatsApp</button>
      </form>
      <div id="rsvp-res" style="display:none;margin-top:10px;"></div>
    </div>
  </main>
  <script src="../assets/shared.js"></script>
  <script>
    const EVENT_INFO = { title: 'Wedding of Tamer & Hana', start: '2027-12-17T18:00:00Z', end: '2027-12-17T23:30:00Z', location: 'Four Seasons Nile Plaza, Cairo' };
    document.getElementById('locket').addEventListener('click', () => {
      document.getElementById('locket').classList.toggle('is-open');
      try { WeddingSound.startMusic('a_thousand_years'); } catch(_) {}
    });
  </script>
</body></html>
