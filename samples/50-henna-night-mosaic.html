<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آدم و رنا — ليلة الخطوبة والحنة بالفسيفساء الشرقية | مدينة العبور</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--teal:#0F4C5C;--terra:#B84A39;--saffron:#E3A842;--cream:#FFF8EE}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:repeating-linear-gradient(45deg,rgba(15,76,92,.08) 0 12px,rgba(227,168,66,.08) 12px 24px),var(--cream);color:#261A16;font-family:'Cairo',sans-serif;min-height:100vh;padding:18px 14px 60px}
    .amiri{font-family:'Amiri',serif}
    .tile-frame{max-width:480px;margin:0 auto;padding:10px;border-radius:24px;background:linear-gradient(135deg,var(--teal),var(--terra),var(--saffron));box-shadow:0 22px 55px rgba(15,76,92,.22)}
    .tile-inner{background:var(--cream);border-radius:16px;padding:22px 18px 28px;text-align:center}
    .hero{width:100%;height:190px;border-radius:14px;object-fit:cover;border:2px solid var(--saffron);margin-bottom:16px}
    .palette{display:flex;justify-content:center;gap:10px;margin:14px 0 18px;align-items:center;font-size:12px}
    .dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
    .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
    .cd div{background:var(--teal);color:#fff;border-radius:12px;padding:9px 4px}
    .cd strong{display:block;font-size:20px;color:var(--saffron)} .cd span{font-size:10px}
    .inp{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid rgba(15,76,92,.2);margin-bottom:9px;font:inherit;font-size:13px;background:#fff}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border-radius:999px;font:700 13px inherit;border:0;cursor:pointer;text-decoration:none}
    .btn-t{background:linear-gradient(135deg,var(--terra),var(--saffron));color:#fff}
    .btn-o{border:1.5px solid var(--teal);color:var(--teal);background:#fff}
  </style>
  <style id="meem-mobile-fit">
  @media (max-width: 480px) {
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { max-width: 100vw; overflow-x: hidden; }

    /* Compact outer padding & card width so invitations breathe on mobile */
    body:not(:has(.story-frame)):not(:has(.video-hero)):not(:has(.reel-box)):not(:has(.poster)) {
      padding-left: 12px !important;
      padding-right: 12px !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .shell, .main,
    .watch-wrap, .card-wrap, .card-shell, .invite-shell, .stage, .accordion,
    .flip-wrap, .below, .arch-wrap, .glass-shell, .gala, .tile-frame, .body {
      max-width: min(346px, calc(100vw - 24px)) !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .main, .gala {
      padding-top: 18px !important;
      padding-bottom: 44px !important;
      padding-left: 4px !important;
      padding-right: 4px !important;
    }
    .shell, .arch-wrap {
      margin-top: 16px !important;
      margin-bottom: 44px !important;
      padding-left: 4px !important;
      padding-right: 4px !important;
    }

    /* Inner cards, arches & sections: refined padding & height */
    .arch-header, .watercolor-hero {
      padding: 28px 16px 22px !important;
      min-height: auto !important;
    }
    .section-block {
      padding: 22px 15px !important;
    }
    .card, .glass, .glass-card, .details-card, .hero-card, .venue-card, .panel {
      padding: 18px 15px !important;
      border-radius: 18px !important;
    }
    .ogee-card, .couture-card {
      padding: 28px 16px 22px !important;
      border-radius: 130px 130px 22px 22px !important;
    }
    .couture-card { border-radius: 22px !important; }
    .bifold-card .card-inner, .card-cover {
      padding: 26px 18px !important;
    }

    /* Liquid Glass series (60-65) */
    .glass-arch, .floral-glass-arch, .mihrab-card {
      width: min(338px, calc(100vw - 24px)) !important;
      min-height: 500px !important;
      padding: 32px 16px 20px !important;
      border-radius: 124px 124px 26px 26px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      inset: 6px !important;
      border-radius: 118px 118px 20px 20px !important;
    }
    .kinetic-peony-card {
      width: min(338px, calc(100vw - 24px)) !important;
      padding: 24px 16px 20px !important;
      border-radius: 32px !important;
    }
    .reel-frame, .cascade-frame {
      width: min(344px, calc(100vw - 20px)) !important;
      height: min(565px, calc(100dvh - 24px)) !important;
      min-height: 500px !important;
      padding: 14px 14px 16px !important;
      border-radius: 28px !important;
    }
    .workflow-stage-glass { padding: 16px 14px !important; border-radius: 22px !important; }
    .wf-card { padding: 10px 12px !important; margin-bottom: 8px !important; border-radius: 16px !important; }

    /* Full-bleed Video & Reel Heroes (51, 52, 55) */
    .story-frame { width: 100vw !important; height: 100vh !important; height: 100dvh !important; max-height: 100dvh !important; }
    .s-slide { padding: 22px 16px 68px !important; }
    .video-hero { height: 54vh !important; height: 54dvh !important; min-height: 310px !important; padding: 22px 14px !important; }
    .reel-box { height: 50vh !important; height: 50dvh !important; min-height: 290px !important; }
    .hero-wide { height: 220px !important; }
    .g-item { height: 225px !important; }

    /* Balanced Couple Titles & Headings on Mobile */
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(26px, 7.6vw, 32px) !important;
      line-height: 1.16 !important;
    }
    .gate-crest-wrap [data-couple-title], #cover-overlay [data-couple-title],
    .seal-gate [data-couple-title], .mihrab-seal [data-couple-title],
    .cover-names, .cover-title {
      font-size: clamp(22px, 6.6vw, 27px) !important;
    }
    .sec-title, .quote-text {
      font-size: clamp(19px, 5.5vw, 23px) !important;
    }
    .verse, .ayah, .month-poem {
      font-size: 15px !important;
      line-height: 1.75 !important;
    }
    .bronze-mono { font-size: 44px !important; }
    .spaced-date, .date-spaced { letter-spacing: 0.18em !important; font-size: 12px !important; }

    /* Proportioned Seals, Envelopes, Turntable, Watch Dial, Locket & Photos */
    .royal-seal, .wax-seal, .medallion, .wax-crystal, .pearl-medallion {
      width: 82px !important;
      height: 82px !important;
      margin-top: 12px !important;
      margin-bottom: 14px !important;
    }
    .medallion span, .wax-crystal span, .pearl-medallion span { font-size: 26px !important; }
    .cover-seal, .sculpt-mono {
      width: 66px !important;
      height: 66px !important;
      line-height: 66px !important;
      font-size: 22px !important;
      margin-bottom: 12px !important;
    }
    .envelope-stage { width: min(306px, 86vw) !important; height: 210px !important; }
    .envelope-letter { height: 176px !important; }
    .lace-env { width: min(296px, 86vw) !important; height: 208px !important; }
    .turntable { transform: scale(0.8); margin-bottom: 6px !important; }
    .dial-bezel { width: 204px !important; height: 204px !important; margin-bottom: 16px !important; }
    .locket-stage { transform: scale(0.82); margin: 0 auto 8px !important; }
    .venue-hero, .arch-frame, .venue-pic, .hero, .arch-photo, .arch-pic {
      height: 152px !important;
    }
    .arch-portrait { width: 134px !important; height: 166px !important; margin-bottom: 12px !important; }
    .cameo-motion { width: 118px !important; height: 118px !important; margin: 8px auto !important; }
    .couple-frame { width: 88px !important; height: 88px !important; margin-bottom: 10px !important; }
    .photo-frame, .photo-arch { height: 118px !important; margin-top: 9px !important; }
    .front-img { height: 205px !important; }

    /* Compact Countdowns, Date Strips & Buttons */
    .date-strip { gap: 10px !important; padding: 10px 14px !important; font-size: 16px !important; margin-top: 14px !important; }
    .date-pill { margin: 9px 0 !important; padding: 7px 11px !important; }
    .cd, .cd-grid, .countdown-grid, .cd-boxes, .cd-row {
      gap: 6px !important;
      max-width: 296px !important;
      margin: 10px auto 12px !important;
    }
    .cd div, .cd-item, .cd-box { padding: 7px 3px !important; border-radius: 10px !important; }
    .cd strong, .cd-num { font-size: 17px !important; }
    .open-btn, .cover-btn, .spin-btn { padding: 10px 22px !important; font-size: 12px !important; }
    .btn, .btn-pearl, .btn-glass, .btn-gold, .btn-outline, .btn-berry, .btn-pearl-ar, .btn-glass-ar, .tbtn {
      padding: 9px 13px !important;
      font-size: 11.5px !important;
      min-width: 0 !important;
    }
  }
</style>
</head>
<body data-music-mood="amina_okbal_andoko">
  <div class="tile-frame">
    <main class="tile-inner">
      <img class="hero" id="playZaffa" src="../assets/images/golf-city-el-obour.jpg" alt="Golf City El Obour" style="cursor:pointer;" />
      <div style="font-size:11px;font-weight:700;color:var(--terra);letter-spacing:.14em;">أمسية خطوبة وحنة شرقية — مدينة العبور</div>
      <div data-guest-name data-guest-prefix="نورتِ الليلة يا " style="display:none;color:var(--teal);font-weight:700;font-size:13px;margin-top:6px;"></div>
      <h1 class="amiri" style="font-size:clamp(28px,7.8vw,44px);color:var(--teal);margin:4px 0;" data-couple-title>آدم و رنا</h1>
      <p style="font-size:13px;color:#5E4B42;margin-bottom:10px;"><span data-venue-name>نادي جولف سيتي — مدينة العبور</span> • <span data-event-date>الخميس، ٢٨ أكتوبر ٢٠٢٧</span> • ٧:٣٠ مساءً</p>
      <div class="palette">
        <span>ألوان الليلة:</span>
        <span class="dot" style="background:#0F4C5C"></span>
        <span class="dot" style="background:#B84A39"></span>
        <span class="dot" style="background:#E3A842"></span>
        <span class="dot" style="background:#9D174D"></span>
      </div>
      <div class="cd" data-countdown="2027-10-28T19:30:00+02:00">
        <div><strong data-cd="days">00</strong><span>يوم</span></div>
        <div><strong data-cd="hours">00</strong><span>ساعة</span></div>
        <div><strong data-cd="minutes">00</strong><span>دقيقة</span></div>
        <div><strong data-cd="seconds">00</strong><span>ثانية</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:18px;">
        <button type="button" class="btn btn-t" style="flex:1" onclick="WeddingCalendar.openGoogleCalendar(EVENT_INFO)">حفظ الموعد</button>
        <a class="btn btn-o" style="flex:1" href="https://maps.google.com/?q=Golf+City+El+Obour+Egypt" target="_blank" rel="noopener">الخريطة</a>
      </div>
      <form data-rsvp-form data-couple="آدم و رنا" data-lang="ar" data-result-target="rsvp-res">
        <input class="inp" name="guestName" type="text" required placeholder="الاسم الكريم" />
        <input class="inp" name="notes" type="text" placeholder="اقترح أغنية تحب ترقص عليها مع الـ DJ!" />
        <button type="submit" class="btn btn-t" style="width:100%;">تأكيد الحضور وإرسال طلب الأغنية عبر واتساب</button>
      </form>
      <div id="rsvp-res" style="display:none;margin-top:10px;"></div>
    </main>
  </div>
  <script src="../assets/shared.js"></script>
  <script>
    const EVENT_INFO = { title: 'خطوبة وحنة آدم و رنا — العبور', start: '2027-10-28T17:30:00Z', end: '2027-10-28T23:00:00Z', location: 'Golf City, El Obour, Egypt' };
    document.getElementById('playZaffa').addEventListener('click', () => { try { WeddingSound.startMusic('amina_okbal_andoko'); } catch(_) {} });
  </script>
</body></html>
