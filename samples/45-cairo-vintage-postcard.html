<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aly &amp; Malak — Vintage Cairo 3D Flip Postcard | Zamalek</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--cream:#FAF4E8;--navy:#19324D;--terra:#B45338;--gold:#C59A4B}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#ECE3D3;color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding:20px 14px 56px;display:flex;flex-direction:column;align-items:center}
    .play{font-family:'Playfair Display',serif}
    .flip-wrap{width:min(460px,100%);perspective:1400px;margin-bottom:18px}
    .flip-inner{position:relative;width:100%;transition:transform .85s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
    .flip-wrap.is-flipped .flip-inner{transform:rotateY(180deg)}
    .face{backface-visibility:hidden;background:var(--cream);border-radius:14px;border:6px solid #fff;box-shadow:0 20px 50px rgba(25,50,77,.18);overflow:hidden}
    .face-back{position:absolute;inset:0;transform:rotateY(180deg);padding:22px;display:flex;flex-direction:column;justify-content:space-between}
    .front-img{width:100%;height:260px;object-fit:cover;display:block}
    .front-bar{padding:18px;text-align:center;background:var(--cream)}
    .flip-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:999px;background:var(--navy);color:#fff;font:600 12px inherit;border:0;cursor:pointer;margin-top:10px}
    .back-split{display:grid;grid-template-columns:1.1fr 0.9fr;gap:14px;border-top:1px solid rgba(25,50,77,.16);padding-top:14px;font-size:12px}
    .stamp-box{border:2px dotted var(--terra);padding:6px;text-align:center;font-size:10px;font-weight:700;color:var(--terra);margin-bottom:10px}
    .below{width:min(460px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 12px 30px rgba(25,50,77,.09)}
    .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;text-align:center}
    .cd div{background:var(--cream);border-radius:10px;padding:8px 4px}
    .cd strong{display:block;font-size:20px;color:var(--terra)} .cd span{font-size:9.5px;text-transform:uppercase}
    .inp{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(25,50,77,.2);margin-bottom:10px;font:inherit}
    .btn-t{width:100%;padding:11px;border-radius:999px;background:var(--terra);color:#fff;font:600 12.5px inherit;border:0;cursor:pointer}
  </style>
  <style id="meem-mobile-fit">
  /* Universal Full-Screen Mobile & Cross-Device Responsive Scaling */
  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: clip !important;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  /* Responsive Full-Screen Mobile (phones & phablets up to 640px) */
  @media (max-width: 640px) {
    body {
      padding: 10px 8px 36px !important;
    }
    body:has(.story-frame), body:has(.reel-frame), body:has(.cascade-frame),
    body:has(.video-hero), body:has(.reel-box), body:has(.poster) {
      padding: 0 !important;
    }

    /* Fill full mobile width cleanly — never shrink to a tiny centered box */
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .shell, .main,
    .watch-wrap, .card-wrap, .card-shell, .invite-shell, .stage, .accordion,
    .flip-wrap, .below, .arch-wrap, .glass-shell, .gala, .tile-frame, .body {
      width: 100% !important;
      max-width: 100% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .main, .gala {
      padding-top: 12px !important;
      padding-bottom: 42px !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }
    .shell, .arch-wrap {
      margin-top: 8px !important;
      margin-bottom: 36px !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }

    /* Inner cards & sections: balanced breathing room */
    .arch-header, .watercolor-hero {
      padding: 32px 18px 24px !important;
      min-height: auto !important;
    }
    .section-block { padding: 24px 16px !important; }
    .card, .glass, .glass-card, .details-card, .hero-card, .venue-card, .panel {
      padding: 20px 16px !important;
      border-radius: 20px !important;
    }
    .ogee-card {
      width: 100% !important;
      padding: 32px 18px 24px !important;
      border-radius: 140px 140px 24px 24px !important;
    }
    .couture-card {
      width: 100% !important;
      padding: 28px 18px 24px !important;
      border-radius: 24px !important;
    }
    .bifold-card .card-inner, .card-cover { padding: 28px 18px !important; }

    /* Liquid Glass Arches & Peony (60, 61, 62, 65): full-screen presence on mobile */
    .glass-arch, .floral-glass-arch, .mihrab-card {
      width: 100% !important;
      max-width: 100% !important;
      min-height: calc(100dvh - 20px) !important;
      padding: 36px 20px 26px !important;
      border-radius: 150px 150px 28px 28px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      inset: 7px !important;
      border-radius: 143px 143px 21px 21px !important;
    }
    .kinetic-peony-card {
      width: 100% !important;
      max-width: 100% !important;
      min-height: calc(100dvh - 20px) !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      padding: 30px 20px 24px !important;
      border-radius: 34px !important;
    }

    /* Full-Bleed Edge-to-Edge Video & Workflow Reels (63, 64, 55) on Mobile */
    .reel-frame, .cascade-frame {
      width: 100vw !important;
      max-width: 100vw !important;
      min-height: 100dvh !important;
      height: auto !important;
      border-radius: 0 !important;
      border: 0 !important;
      padding: 20px 16px 32px !important;
    }
    .story-frame {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100dvh !important;
      min-height: 100dvh !important;
      border-radius: 0 !important;
    }
    .s-slide { padding: 24px 18px 72px !important; }
    .video-hero { height: 58dvh !important; min-height: 340px !important; padding: 24px 16px !important; }
    .reel-box { height: 54dvh !important; min-height: 320px !important; }
    .hero-wide { height: 240px !important; }
    .g-item { height: 240px !important; }

    /* Grand, Readable Couple Titles & Typography on Full-Screen Mobile */
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(30px, 8.8vw, 42px) !important;
      line-height: 1.15 !important;
    }
    .gate-crest-wrap [data-couple-title], #cover-overlay [data-couple-title],
    .seal-gate [data-couple-title], .mihrab-seal [data-couple-title],
    .flow-gate [data-couple-title], .cover-names, .cover-title {
      font-size: clamp(28px, 8vw, 38px) !important;
    }
    .sec-title, .quote-text { font-size: clamp(22px, 6vw, 28px) !important; }
    .verse, .ayah, .month-poem { font-size: clamp(15px, 4.2vw, 18px) !important; line-height: 1.78 !important; }

    /* Well-Proportioned Interactive Elements */
    .royal-seal, .wax-seal, .medallion, .wax-crystal, .pearl-medallion, .flow-orb {
      width: clamp(86px, 24vw, 108px) !important;
      height: clamp(86px, 24vw, 108px) !important;
    }
    .envelope-stage, .lace-env { width: min(360px, 92vw) !important; height: auto !important; min-height: 224px !important; }
    .dial-bezel { width: min(240px, 68vw) !important; height: min(240px, 68vw) !important; }
    .photo-frame, .photo-arch { height: clamp(140px, 36vw, 185px) !important; }
    .cameo-motion { width: clamp(128px, 34vw, 156px) !important; height: clamp(128px, 34vw, 156px) !important; }
    .cd, .cd-grid, .countdown-grid, .cd-boxes, .cd-row {
      width: 100% !important;
      max-width: 100% !important;
      gap: 8px !important;
    }
    .btn, .btn-pearl, .btn-glass, .btn-gold, .btn-outline, .btn-berry, .btn-pearl-ar, .btn-glass-ar, .tbtn {
      padding: 11px 16px !important;
      font-size: 13px !important;
    }
  }

  /* Compact Extra-Small Viewport (e.g. inside 350px desktop preview phone iframe) */
  @media (max-width: 375px) {
    .glass-arch, .floral-glass-arch, .mihrab-card {
      padding: 28px 15px 20px !important;
      border-radius: 120px 120px 24px 24px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      border-radius: 113px 113px 17px 17px !important;
    }
    .kinetic-peony-card { padding: 22px 15px 18px !important; border-radius: 28px !important; }
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(26px, 8vw, 34px) !important;
    }
    .photo-frame, .photo-arch { height: 126px !important; }
    .cameo-motion { width: 116px !important; height: 116px !important; }
  }
</style>
</head>
<body data-music-mood="another_love_piano">
  <div class="flip-wrap" id="cardFlip">
    <div class="flip-inner">
      <div class="face face-front">
        <img class="front-img" src="../assets/images/zamalek-marriott-palace.jpg" alt="Greetings from Zamalek Cairo" />
        <div class="front-bar">
          <div style="font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--terra);font-weight:700;">GREETINGS FROM ZAMALEK, CAIRO</div>
          <h1 class="play" style="font-size:34px;margin:4px 0;" data-couple-title>Aly &amp; Malak</h1>
          <div style="font-size:12px;color:#5D6D7E;" data-event-date>Friday, October 8, 2027 · 7:00 PM</div>
          <button type="button" class="flip-btn" id="toBack">Flip Postcard for Invitation ↻</button>
        </div>
      </div>
      <div class="face face-back">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <strong class="play" style="font-size:18px;letter-spacing:.12em;">POST CARD</strong>
            <button type="button" class="flip-btn" style="margin:0;padding:5px 12px;font-size:11px;" id="toFront">Front ↻</button>
          </div>
          <div class="back-split">
            <div>
              <div data-guest-name data-guest-prefix="Dear " style="display:none;font-weight:700;color:var(--terra);margin-bottom:6px;"></div>
              <p style="line-height:1.6;">Pack your finest evening attire and join us by the Nile in Zamalek as we tie the knot!</p>
              <p style="margin-top:8px;font-weight:700;" data-venue-name>Zamalek Gezira Riverfront, Cairo</p>
            </div>
            <div style="border-left:1px solid rgba(25,50,77,.16);padding-left:12px;">
              <div class="stamp-box">EGYPT POST<br>2027 · VIP</div>
              <div style="border-bottom:1px solid rgba(25,50,77,.2);padding:4px 0;font-size:11px;" data-table-seat>Table 09</div>
              <div style="border-bottom:1px solid rgba(25,50,77,.2);padding:4px 0;font-size:11px;">Cairo, Egypt</div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button type="button" class="btn-t" style="background:var(--navy);" onclick="WeddingCalendar.openGoogleCalendar(EVENT_INFO)">Save Date</button>
          <a class="btn-t" style="text-align:center;text-decoration:none;" href="https://maps.google.com/?q=Zamalek+Cairo+Nile" target="_blank" rel="noopener">Open Map</a>
        </div>
      </div>
    </div>
  </div>
  <section class="below">
    <div class="cd" data-countdown="2027-10-08T19:00:00+03:00">
      <div><strong data-cd="days">00</strong><span>Days</span></div>
      <div><strong data-cd="hours">00</strong><span>Hours</span></div>
      <div><strong data-cd="minutes">00</strong><span>Mins</span></div>
      <div><strong data-cd="seconds">00</strong><span>Secs</span></div>
    </div>
    <form data-rsvp-form data-couple="Aly & Malak" data-lang="en" data-result-target="rsvp-res">
      <input class="inp" name="guestName" type="text" required placeholder="Your Name" />
      <button type="submit" class="btn-t">Send Postcard RSVP on WhatsApp</button>
    </form>
    <div id="rsvp-res" style="display:none;margin-top:10px;"></div>
  </section>
  <script src="../assets/shared.js"></script>
  <script>
    const EVENT_INFO = { title: 'Wedding of Aly & Malak — Zamalek', start: '2027-10-08T16:00:00Z', end: '2027-10-08T22:30:00Z', location: 'Zamalek, Cairo, Egypt' };
    const flip = document.getElementById('cardFlip');
    document.getElementById('toBack').addEventListener('click', () => { flip.classList.add('is-flipped'); try { WeddingSound.startMusic('another_love_piano'); } catch(_) {} });
    document.getElementById('toFront').addEventListener('click', () => flip.classList.remove('is-flipped'));
  </script>
</body></html>
