<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youssef &amp; Farah — Cinematic Video Hero Wedding | The Nile Ritz-Carlton</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0E1216;--gold:#E5C682;--ivory:#FAF6EE;--muted:#C8C2B8}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ivory);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;overflow-x:hidden}
    .serif{font-family:'Cormorant Garamond',serif} .script{font-family:'Great Vibes',cursive}
    .video-hero{position:relative;height:82vh;min-height:460px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:34px 18px;cursor:pointer}
    .video-hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62) contrast(1.06)}
    .video-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,18,22,.25) 0%,rgba(14,18,22,.45) 55%,rgba(14,18,22,1) 100%)}
    .hero-content{position:relative;z-index:2;max-width:460px;animation:rise 1s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    .couple-frame{width:116px;height:116px;border-radius:50%;margin:0 auto 14px;border:2.5px solid var(--gold);overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55)}
    .couple-frame img{width:100%;height:100%;object-fit:cover}
    .pill{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(229,198,130,.15);border:1px solid rgba(229,198,130,.5);color:var(--gold);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
    .main{max-width:500px;margin:0 auto;padding:12px 16px 64px;text-align:center}
    .glass{background:rgba(255,255,255,.04);border:1px solid rgba(229,198,130,.28);border-radius:20px;padding:22px 18px;margin-bottom:16px;backdrop-filter:blur(10px)}
    .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
    .cd div{background:rgba(229,198,130,.08);border-radius:12px;padding:10px 4px}
    .cd strong{display:block;font-size:22px;color:var(--gold)} .cd span{font-size:9.5px;text-transform:uppercase;color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border-radius:999px;font:600 12.5px inherit;border:0;cursor:pointer;text-decoration:none}
    .btn-g{background:var(--gold);color:#111} .btn-o{border:1px solid rgba(229,198,130,.5);color:var(--gold);background:transparent}
    .inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(229,198,130,.3);background:rgba(255,255,255,.06);color:#fff;font:inherit;margin-bottom:10px}
  </style>
  <style id="meem-mobile-fit">
  @media (max-width: 480px) {
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { max-width: 100vw; overflow-x: hidden; }

    /* Compact outer padding & card width so invitations breathe on mobile */
    body:not(:has(.story-frame)):not(:has(.video-hero)):not(:has(.reel-box)):not(:has(.poster)) {
      padding-left: 12px !important;
      padding-right: 12px !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .shell, .main,
    .watch-wrap, .card-wrap, .card-shell, .invite-shell, .stage, .accordion,
    .flip-wrap, .below, .arch-wrap, .glass-shell, .gala, .tile-frame, .body {
      max-width: min(346px, calc(100vw - 24px)) !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .main, .gala {
      padding-top: 18px !important;
      padding-bottom: 44px !important;
      padding-left: 4px !important;
      padding-right: 4px !important;
    }
    .shell, .arch-wrap {
      margin-top: 16px !important;
      margin-bottom: 44px !important;
      padding-left: 4px !important;
      padding-right: 4px !important;
    }

    /* Inner cards, arches & sections: refined padding & height */
    .arch-header, .watercolor-hero {
      padding: 28px 16px 22px !important;
      min-height: auto !important;
    }
    .section-block {
      padding: 22px 15px !important;
    }
    .card, .glass, .glass-card, .details-card, .hero-card, .venue-card, .panel {
      padding: 18px 15px !important;
      border-radius: 18px !important;
    }
    .ogee-card, .couture-card {
      padding: 28px 16px 22px !important;
      border-radius: 130px 130px 22px 22px !important;
    }
    .couture-card { border-radius: 22px !important; }
    .bifold-card .card-inner, .card-cover {
      padding: 26px 18px !important;
    }

    /* Liquid Glass series (60-65) */
    .glass-arch, .floral-glass-arch, .mihrab-card {
      width: min(338px, calc(100vw - 24px)) !important;
      min-height: 500px !important;
      padding: 32px 16px 20px !important;
      border-radius: 124px 124px 26px 26px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      inset: 6px !important;
      border-radius: 118px 118px 20px 20px !important;
    }
    .kinetic-peony-card {
      width: min(338px, calc(100vw - 24px)) !important;
      padding: 24px 16px 20px !important;
      border-radius: 32px !important;
    }
    .reel-frame, .cascade-frame {
      width: min(344px, calc(100vw - 20px)) !important;
      height: min(565px, calc(100dvh - 24px)) !important;
      min-height: 500px !important;
      padding: 14px 14px 16px !important;
      border-radius: 28px !important;
    }
    .workflow-stage-glass { padding: 16px 14px !important; border-radius: 22px !important; }
    .wf-card { padding: 10px 12px !important; margin-bottom: 8px !important; border-radius: 16px !important; }

    /* Full-bleed Video & Reel Heroes (51, 52, 55) */
    .story-frame { width: 100vw !important; height: 100vh !important; height: 100dvh !important; max-height: 100dvh !important; }
    .s-slide { padding: 22px 16px 68px !important; }
    .video-hero { height: 54vh !important; height: 54dvh !important; min-height: 310px !important; padding: 22px 14px !important; }
    .reel-box { height: 50vh !important; height: 50dvh !important; min-height: 290px !important; }
    .hero-wide { height: 220px !important; }
    .g-item { height: 225px !important; }

    /* Balanced Couple Titles & Headings on Mobile */
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(26px, 7.6vw, 32px) !important;
      line-height: 1.16 !important;
    }
    .gate-crest-wrap [data-couple-title], #cover-overlay [data-couple-title],
    .seal-gate [data-couple-title], .mihrab-seal [data-couple-title],
    .cover-names, .cover-title {
      font-size: clamp(22px, 6.6vw, 27px) !important;
    }
    .sec-title, .quote-text {
      font-size: clamp(19px, 5.5vw, 23px) !important;
    }
    .verse, .ayah, .month-poem {
      font-size: 15px !important;
      line-height: 1.75 !important;
    }
    .bronze-mono { font-size: 44px !important; }
    .spaced-date, .date-spaced { letter-spacing: 0.18em !important; font-size: 12px !important; }

    /* Proportioned Seals, Envelopes, Turntable, Watch Dial, Locket & Photos */
    .royal-seal, .wax-seal, .medallion, .wax-crystal, .pearl-medallion {
      width: 82px !important;
      height: 82px !important;
      margin-top: 12px !important;
      margin-bottom: 14px !important;
    }
    .medallion span, .wax-crystal span, .pearl-medallion span { font-size: 26px !important; }
    .cover-seal, .sculpt-mono {
      width: 66px !important;
      height: 66px !important;
      line-height: 66px !important;
      font-size: 22px !important;
      margin-bottom: 12px !important;
    }
    .envelope-stage { width: min(306px, 86vw) !important; height: 210px !important; }
    .envelope-letter { height: 176px !important; }
    .lace-env { width: min(296px, 86vw) !important; height: 208px !important; }
    .turntable { transform: scale(0.8); margin-bottom: 6px !important; }
    .dial-bezel { width: 204px !important; height: 204px !important; margin-bottom: 16px !important; }
    .locket-stage { transform: scale(0.82); margin: 0 auto 8px !important; }
    .venue-hero, .arch-frame, .venue-pic, .hero, .arch-photo, .arch-pic {
      height: 152px !important;
    }
    .arch-portrait { width: 134px !important; height: 166px !important; margin-bottom: 12px !important; }
    .cameo-motion { width: 118px !important; height: 118px !important; margin: 8px auto !important; }
    .couple-frame { width: 88px !important; height: 88px !important; margin-bottom: 10px !important; }
    .photo-frame, .photo-arch { height: 118px !important; margin-top: 9px !important; }
    .front-img { height: 205px !important; }

    /* Compact Countdowns, Date Strips & Buttons */
    .date-strip { gap: 10px !important; padding: 10px 14px !important; font-size: 16px !important; margin-top: 14px !important; }
    .date-pill { margin: 9px 0 !important; padding: 7px 11px !important; }
    .cd, .cd-grid, .countdown-grid, .cd-boxes, .cd-row {
      gap: 6px !important;
      max-width: 296px !important;
      margin: 10px auto 12px !important;
    }
    .cd div, .cd-item, .cd-box { padding: 7px 3px !important; border-radius: 10px !important; }
    .cd strong, .cd-num { font-size: 17px !important; }
    .open-btn, .cover-btn, .spin-btn { padding: 10px 22px !important; font-size: 12px !important; }
    .btn, .btn-pearl, .btn-glass, .btn-gold, .btn-outline, .btn-berry, .btn-pearl-ar, .btn-glass-ar, .tbtn {
      padding: 9px 13px !important;
      font-size: 11.5px !important;
      min-width: 0 !important;
    }
  }
</style>
</head>
<body data-music-mood="young_and_beautiful" data-particles="gold-dust">
  <section class="video-hero" id="videoHero">
    <video autoplay muted loop playsinline poster="../assets/images/nile-ritz-carlton-twilight.jpg">
      <source src="../assets/video/wedding-intro-loop.mp4" type="video/mp4" />
    </video>
    <div class="hero-content">
      <div class="couple-frame"><img data-couple-photo src="../assets/images/editorial-couple.jpg" alt="Couple Portrait" /></div>
      <div class="pill">Motion Video Invitation · Tap for Sound</div>
      <h1 class="script" style="font-size:clamp(28px,7.8vw,52px);line-height:1.1;color:#fff;" data-couple-title>Youssef &amp; Farah</h1>
      <div style="font-size:13px;color:var(--gold);margin-top:6px;" data-event-date>Saturday, November 20, 2027 · 8:00 PM</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px;" data-venue-name>The Nile Ritz-Carlton · Downtown Cairo</div>
    </div>
  </section>
  <main class="main">
    <div class="glass">
      <div style="font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;">Countdown to Our Celebration</div>
      <div class="cd" data-countdown="2027-11-20T20:00:00+02:00">
        <div><strong data-cd="days">00</strong><span>Days</span></div>
        <div><strong data-cd="hours">00</strong><span>Hours</span></div>
        <div><strong data-cd="minutes">00</strong><span>Mins</span></div>
        <div><strong data-cd="seconds">00</strong><span>Secs</span></div>
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Reserved Seating: <strong style="color:var(--gold);" data-table-seat>Table 04 · VIP</strong></div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn btn-g" style="flex:1" onclick="WeddingCalendar.openGoogleCalendar(EVENT_INFO)">Save Date</button>
        <a class="btn btn-o" style="flex:1" href="https://maps.google.com/?q=The+Nile+Ritz-Carlton+Cairo" target="_blank" rel="noopener">Open Map</a>
      </div>
    </div>
    <div class="glass">
      <div class="serif" style="font-size:24px;color:var(--gold);margin-bottom:10px;">Confirm Attendance</div>
      <form data-rsvp-form data-couple="Youssef & Farah" data-lang="en" data-result-target="rsvp-res">
        <input class="inp" name="guestName" type="text" required placeholder="Your Name" />
        <button type="submit" class="btn btn-g" style="width:100%;">Confirm via WhatsApp</button>
      </form>
      <div id="rsvp-res" style="display:none;margin-top:10px;"></div>
    </div>
  </main>
  <script src="../assets/shared.js"></script>
  <script>
    const EVENT_INFO = { title: 'Wedding of Youssef & Farah', start: '2027-11-20T18:00:00Z', end: '2027-11-20T23:30:00Z', location: 'The Nile Ritz-Carlton, Cairo' };
    document.getElementById('videoHero').addEventListener('click', () => { try { WeddingSound.startMusic('young_and_beautiful'); } catch(_) {} });
  </script>
</body></html>
