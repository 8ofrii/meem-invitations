<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Karim &amp; Nour — Smoked Champagne Crystal Arch | MEEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; font-family: 'Plus Jakarta Sans', sans-serif;
      background: #1A110B; display: flex; align-items: center; justify-content: center;
      padding: 14px 12px 46px; position: relative; overflow-x: hidden;
    }
    .bg-motion {
      position: fixed; inset: -6%;
      background:
        radial-gradient(circle at 22% 18%, rgba(255, 214, 153, 0.36) 0%, transparent 45%),
        radial-gradient(circle at 82% 72%, rgba(212, 145, 78, 0.34) 0%, transparent 50%),
        url('../assets/images/villa-belle-epoque-maadi.jpg') center/cover no-repeat;
      animation: bgDrift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes bgDrift { from { transform: scale(1); } to { transform: scale(1.08) translateY(-10px); } }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 1;
      background: radial-gradient(circle at 50% 35%, rgba(42, 28, 16, 0.44), rgba(18, 11, 6, 0.76));
      pointer-events: none;
    }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .glass-arch {
      position: relative; z-index: 2; width: min(440px, 100%); min-height: min(568px, calc(100dvh - 40px));
      border-radius: 142px 142px 32px 32px; padding: 36px 22px 24px;
      text-align: center; color: #FFFBF4;
      background: linear-gradient(168deg, rgba(255,250,242,0.34) 0%, rgba(210,178,140,0.18) 46%, rgba(46,30,18,0.46) 100%);
      backdrop-filter: blur(28px) saturate(185%); -webkit-backdrop-filter: blur(28px) saturate(185%);
      border: 1.5px solid rgba(255, 248, 234, 0.72);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.85), inset 0 -1.5px 2px rgba(245,208,156,0.34), 0 32px 74px rgba(10,5,2,0.56);
      display: flex; flex-direction: column; justify-content: center; overflow: hidden;
    }
    .glass-arch::before {
      content: ''; position: absolute; inset: 8px; border-radius: 134px 134px 24px 24px;
      border: 1px solid rgba(255, 240, 212, 0.30); pointer-events: none; z-index: 4;
    }
    .sheen {
      position: absolute; top: -40%; left: -125%; width: 65%; height: 180%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.34), transparent);
      transform: rotate(24deg); pointer-events: none; z-index: 3;
      animation: sheenSweep 6.5s ease-in-out infinite;
    }
    @keyframes sheenSweep { 0%, 44% { left: -125%; } 100% { left: 175%; } }

    .card-body {
      position: relative; z-index: 3;
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(16px) scale(0.98);
      transition: opacity .6s ease .12s, transform .65s cubic-bezier(.22,1,.36,1) .12s;
    }
    .glass-arch.is-open .card-body { opacity: 1; visibility: visible; pointer-events: auto; transform: none; }

    .seal-gate {
      position: absolute; inset: 0; z-index: 10; border-radius: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 26px; cursor: pointer;
      transition: opacity .5s ease, transform .55s cubic-bezier(.22,1,.36,1), visibility 0s linear 0s;
    }
    .glass-arch.is-open .seal-gate {
      opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.07);
      transition: opacity .45s ease, transform .55s cubic-bezier(.22,1,.36,1), visibility 0s linear .5s;
    }
    .medallion {
      width: 104px; height: 104px; border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, rgba(255,255,255,0.56), rgba(212,175,112,0.30) 55%, rgba(92,64,38,0.50));
      border: 1.5px solid rgba(255,246,228,0.85);
      box-shadow: inset 0 2px 5px rgba(255,255,255,0.88), 0 16px 38px rgba(0,0,0,0.38), 0 0 0 8px rgba(255,240,214,0.12);
      display: grid; place-items: center; margin: 22px 0;
      animation: sealPulse 3.2s ease-in-out infinite;
    }
    @keyframes sealPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }

    .photo-frame {
      width: 100%; height: 146px; margin: 13px auto 0; padding: 4px;
      border-radius: 73px 73px 18px 18px;
      background: rgba(255,250,240,0.20); border: 1px solid rgba(255,246,228,0.52);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.6), 0 10px 26px rgba(0,0,0,0.22); overflow: hidden;
    }
    .photo-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 69px 69px 14px 14px; display: block; }
    .date-pill {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
      margin: 13px 0 11px; padding: 10px 14px; border-radius: 999px;
      background: rgba(255,250,240,0.14); border: 1px solid rgba(255,246,230,0.42);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.52);
    }
    .cd { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin: 11px 0; }
    .cd div {
      padding: 8px 4px; border-radius: 14px;
      background: rgba(255,250,242,0.12); border: 1px solid rgba(255,245,228,0.34);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.38);
    }
    .btn-pearl {
      width: 100%; padding: 11px 18px; border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,253,248,0.95), rgba(243,224,190,0.92));
      color: #2B1D12; font: 700 11.5px inherit; letter-spacing: .07em; text-transform: uppercase;
      border: 1px solid #fff; cursor: pointer; text-decoration: none; display: inline-block;
    }
    .btn-glass {
      width: 100%; padding: 10px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.12); color: #FFFBF4; font: 600 11.5px inherit;
      border: 1px solid rgba(255,245,228,0.40); text-decoration: none; display: inline-block;
    }
    .inp {
      width: 100%; padding: 9px 12px; border-radius: 11px;
      border: 1px solid rgba(255,255,255,0.34); background: rgba(255,255,255,0.14);
      color: #fff; font: inherit; font-size: 12.5px; outline: none; margin-bottom: 8px;
    }
    .inp::placeholder { color: rgba(255,248,236,0.75); }
  </style>
  <style id="meem-mobile-fit">
  /* Universal Full-Screen Mobile & Cross-Device Responsive Scaling */
  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: clip !important;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  /* Responsive Full-Screen Mobile (phones & phablets up to 640px) */
  @media (max-width: 640px) {
    body {
      padding: 10px 8px 36px !important;
    }
    body:has(.story-frame), body:has(.reel-frame), body:has(.cascade-frame),
    body:has(.video-hero), body:has(.reel-box), body:has(.poster) {
      padding: 0 !important;
    }

    /* Fill full mobile width cleanly — never shrink to a tiny centered box */
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .shell, .main,
    .watch-wrap, .card-wrap, .card-shell, .invite-shell, .stage, .accordion,
    .flip-wrap, .below, .arch-wrap, .glass-shell, .gala, .tile-frame, .body {
      width: 100% !important;
      max-width: 100% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    .page-wrap, .invitation-shell, .editorial-wrap, .container, .wrap, .main, .gala {
      padding-top: 12px !important;
      padding-bottom: 42px !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }
    .shell, .arch-wrap {
      margin-top: 8px !important;
      margin-bottom: 36px !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }

    /* Inner cards & sections: balanced breathing room */
    .arch-header, .watercolor-hero {
      padding: 32px 18px 24px !important;
      min-height: auto !important;
    }
    .section-block { padding: 24px 16px !important; }
    .card, .glass, .glass-card, .details-card, .hero-card, .venue-card, .panel {
      padding: 20px 16px !important;
      border-radius: 20px !important;
    }
    .ogee-card {
      width: 100% !important;
      padding: 32px 18px 24px !important;
      border-radius: 140px 140px 24px 24px !important;
    }
    .couture-card {
      width: 100% !important;
      padding: 28px 18px 24px !important;
      border-radius: 24px !important;
    }
    .bifold-card .card-inner, .card-cover { padding: 28px 18px !important; }

    /* Liquid Glass Arches & Peony (60, 61, 62, 65): full-screen presence on mobile */
    .glass-arch, .floral-glass-arch, .mihrab-card {
      width: 100% !important;
      max-width: 100% !important;
      min-height: calc(100dvh - 20px) !important;
      padding: 36px 20px 26px !important;
      border-radius: 150px 150px 28px 28px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      inset: 7px !important;
      border-radius: 143px 143px 21px 21px !important;
    }
    .kinetic-peony-card {
      width: 100% !important;
      max-width: 100% !important;
      min-height: calc(100dvh - 20px) !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      padding: 30px 20px 24px !important;
      border-radius: 34px !important;
    }

    /* Full-Bleed Edge-to-Edge Video & Workflow Reels (63, 64, 55) on Mobile */
    .reel-frame, .cascade-frame {
      width: 100vw !important;
      max-width: 100vw !important;
      min-height: 100dvh !important;
      height: auto !important;
      border-radius: 0 !important;
      border: 0 !important;
      padding: 20px 16px 32px !important;
    }
    .story-frame {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100dvh !important;
      min-height: 100dvh !important;
      border-radius: 0 !important;
    }
    .s-slide { padding: 24px 18px 72px !important; }
    .video-hero { height: 58dvh !important; min-height: 340px !important; padding: 24px 16px !important; }
    .reel-box { height: 54dvh !important; min-height: 320px !important; }
    .hero-wide { height: 240px !important; }
    .g-item { height: 240px !important; }

    /* Grand, Readable Couple Titles & Typography on Full-Screen Mobile */
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(30px, 8.8vw, 42px) !important;
      line-height: 1.15 !important;
    }
    .gate-crest-wrap [data-couple-title], #cover-overlay [data-couple-title],
    .seal-gate [data-couple-title], .mihrab-seal [data-couple-title],
    .flow-gate [data-couple-title], .cover-names, .cover-title {
      font-size: clamp(28px, 8vw, 38px) !important;
    }
    .sec-title, .quote-text { font-size: clamp(22px, 6vw, 28px) !important; }
    .verse, .ayah, .month-poem { font-size: clamp(15px, 4.2vw, 18px) !important; line-height: 1.78 !important; }

    /* Well-Proportioned Interactive Elements */
    .royal-seal, .wax-seal, .medallion, .wax-crystal, .pearl-medallion, .flow-orb {
      width: clamp(86px, 24vw, 108px) !important;
      height: clamp(86px, 24vw, 108px) !important;
    }
    .envelope-stage, .lace-env { width: min(360px, 92vw) !important; height: auto !important; min-height: 224px !important; }
    .dial-bezel { width: min(240px, 68vw) !important; height: min(240px, 68vw) !important; }
    .photo-frame, .photo-arch { height: clamp(140px, 36vw, 185px) !important; }
    .cameo-motion { width: clamp(128px, 34vw, 156px) !important; height: clamp(128px, 34vw, 156px) !important; }
    .cd, .cd-grid, .countdown-grid, .cd-boxes, .cd-row {
      width: 100% !important;
      max-width: 100% !important;
      gap: 8px !important;
    }
    .btn, .btn-pearl, .btn-glass, .btn-gold, .btn-outline, .btn-berry, .btn-pearl-ar, .btn-glass-ar, .tbtn {
      padding: 11px 16px !important;
      font-size: 13px !important;
    }
  }

  /* Compact Extra-Small Viewport (e.g. inside 350px desktop preview phone iframe) */
  @media (max-width: 375px) {
    .glass-arch, .floral-glass-arch, .mihrab-card {
      padding: 28px 15px 20px !important;
      border-radius: 120px 120px 24px 24px !important;
    }
    .glass-arch::before, .floral-glass-arch::before, .mihrab-card::before {
      border-radius: 113px 113px 17px 17px !important;
    }
    .kinetic-peony-card { padding: 22px 15px 18px !important; border-radius: 28px !important; }
    [data-couple-title], .couple-names, .couple-h1, .hero-names, .script-name, .names, .title {
      font-size: clamp(26px, 8vw, 34px) !important;
    }
    .photo-frame, .photo-arch { height: 126px !important; }
    .cameo-motion { width: 116px !important; height: 116px !important; }
  }
</style>
</head>
<body data-music-mood="another_love_piano" data-music-src="../assets/audio/another-love-piano.mp3" data-particles="gold-dust">
  <div class="bg-motion"></div>

  <article class="glass-arch" id="archCard">
    <div class="sheen"></div>
    <div class="seal-gate" id="gate">
      <div style="font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,244,224,0.85);">A Private Invitation</div>
      <div class="medallion"><span class="serif" style="font-size:34px;" data-monogram>K &amp; N</span></div>
      <div class="serif" style="font-size:28px;font-weight:500;" data-couple-title>Karim &amp; Nour</div>
      <div class="serif" style="font-style:italic;font-size:16px;color:rgba(255,240,214,0.86);margin-top:3px;" data-event-date>Friday · 22 November 2027</div>
      <div style="margin-top:22px;padding:8px 20px;border-radius:999px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,246,228,0.52);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;">Tap Crystal Seal to Open</div>
    </div>

    <div class="card-body">
      <div style="font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,243,220,0.84);">With Joyful Hearts</div>
      <div data-guest-name data-guest-prefix="Dearest " style="display:none;margin-top:4px;font-size:13px;color:#F8DFB6;"></div>
      <h1 class="serif" style="font-size:clamp(28px,7.8vw,45px);line-height:1.05;font-weight:500;margin-top:6px;" data-couple-title>Karim &amp; Nour</h1>
      <p class="serif" style="font-style:italic;font-size:16.5px;color:rgba(255,244,226,0.92);margin-top:4px;">invite you to celebrate their wedding evening</p>

      <div class="photo-frame">
        <img data-couple-photo src="../assets/images/love-story-couple.jpg" alt="Karim & Nour" />
      </div>

      <div class="date-pill">
        <div style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;">Friday</div>
        <div style="padding:0 12px;border-left:1px solid rgba(255,255,255,0.32);border-right:1px solid rgba(255,255,255,0.32);">
          <b class="serif" style="font-size:24px;line-height:1;display:block;" data-event-date>22 Nov 2027</b>
        </div>
        <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;">8:00 PM</div>
      </div>

      <div style="padding:11px 14px;border-radius:16px;background:rgba(255,250,240,0.11);border:1px solid rgba(255,245,228,0.32);">
        <div class="serif" style="font-size:21px;font-weight:600;" data-venue-name>Villa Belle Époque · Maadi</div>
        <div style="font-size:11px;opacity:.82;margin-top:2px;" data-table-seat>Candlelit Courtyard · VIP Table 04</div>
      </div>

      <div class="cd" data-countdown="2027-11-22T20:00:00+02:00">
        <div><strong data-cd="days" style="font-size:17px;display:block;">48</strong><span style="font-size:8.5px;text-transform:uppercase;opacity:.75;">Days</span></div>
        <div><strong data-cd="hours" style="font-size:17px;display:block;">14</strong><span style="font-size:8.5px;text-transform:uppercase;opacity:.75;">Hrs</span></div>
        <div><strong data-cd="minutes" style="font-size:17px;display:block;">32</strong><span style="font-size:8.5px;text-transform:uppercase;opacity:.75;">Min</span></div>
        <div><strong data-cd="seconds" style="font-size:17px;display:block;">19</strong><span style="font-size:8.5px;text-transform:uppercase;opacity:.75;">Sec</span></div>
      </div>

      <form data-rsvp-form data-couple="Karim & Nour" data-lang="en" data-result-target="rsvp-res" style="margin-top:10px;">
        <input class="inp" name="guestName" required placeholder="Your Full Name for RSVP" />
        <div style="display:grid;grid-template-columns:1.25fr 0.95fr;gap:8px;">
          <button type="submit" class="btn-pearl">Confirm RSVP</button>
          <a class="btn-glass" href="https://maps.google.com/?q=Villa+Belle+Epoque+Maadi+Cairo" target="_blank" rel="noopener">Location ↗</a>
        </div>
      </form>
      <div id="rsvp-res" style="display:none;margin-top:10px;"></div>
    </div>
  </article>

  <script src="../assets/shared.js"></script>
  <script>
    document.getElementById('gate').addEventListener('click', function () {
      document.getElementById('archCard').classList.add('is-open');
      try { WeddingSound.playWaxBreak(); WeddingSound.startMusic('another_love_piano'); } catch (_) {}
    });
  </script>
</body></html>
