<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="MEEM Style 2 - Flowing Cursive ميم">
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D8"/>
      <stop offset="50%" stop-color="#E5C587"/>
      <stop offset="100%" stop-color="#9E722C"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18171E"/>
      <stop offset="100%" stop-color="#0B0B0E"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="160" height="160" rx="34" fill="url(#bg2)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="url(#gold2)" stroke-width="1.2" stroke-opacity="0.32"/>

  <!-- Style 2: Flowing Cursive "ميم" with organic curves -->
  <g fill="none" stroke="url(#gold2)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Initial Meem (right): soft teardrop loop -->
    <path d="M 104 86 C 118 86 124 74 116 66 C 108 58 98 68 104 86 Z" stroke-width="5"/>
    
    <!-- Flowing connector & Yaa arch -->
    <path d="M 104 86 C 94 86 90 76 80 76 C 70 76 66 86 54 86" stroke-width="5"/>
    
    <!-- Final Meem (left): circular head dropping into graceful curved tail -->
    <path d="M 54 86 C 42 86 38 72 48 66 C 58 60 62 76 54 86 Z" stroke-width="5"/>
    <path d="M 42 82 C 40 96 36 108 30 118" stroke-width="5"/>
  </g>

  <!-- Two soft round dots for Yaa under baseline -->
  <g fill="url(#gold2)">
    <circle cx="75" cy="99" r="3.2"/>
    <circle cx="85" cy="99" r="3.2"/>
  </g>
</svg>
