<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="MEEM Style 1 - Geometric Kufic م">
  <defs>
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="140" y2="140">
      <stop offset="0%" stop-color="#FFF2D1"/>
      <stop offset="48%" stop-color="#DFBE7F"/>
      <stop offset="100%" stop-color="#A6782E"/>
    </linearGradient>
    <linearGradient id="bg1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="160">
      <stop offset="0%" stop-color="#191820"/>
      <stop offset="100%" stop-color="#0B0B0E"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="34" fill="url(#bg1)"/>
  <rect x="8" y="8" width="144" height="144" rx="26" fill="none" stroke="url(#g1)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Style 1: Geometric Kufic Arabic letter م (head on top-right, shoulder left, vertical tail dropping on left) -->
  <g fill="none" stroke="url(#g1)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Circular head of م on right -->
    <circle cx="94" cy="60" r="20"/>
    <!-- Smooth horizontal shoulder to the left & crisp vertical tail dropping down -->
    <path d="M 94 80 L 58 80 Q 48 80 48 90 L 48 120"/>
  </g>
</svg>
