<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="MEEM Style 3 - Modern Luxury Signet م">
  <defs>
    <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="140" y2="140">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#EED59B"/>
      <stop offset="100%" stop-color="#A87A30"/>
    </linearGradient>
    <linearGradient id="bg3" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="160">
      <stop offset="0%" stop-color="#18171F"/>
      <stop offset="100%" stop-color="#0B0B0E"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="34" fill="url(#bg3)"/>
  <!-- Subtle luxury diamond frame -->
  <rect x="33" y="33" width="94" height="94" rx="14" transform="rotate(45 80 80)" fill="none" stroke="url(#g3)" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Style 3: Modern Minimalist Arabic letter م (bold geometric squircle head + tapered drop) -->
  <g fill="none" stroke="url(#g3)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="76" y="46" width="32" height="30" rx="11"/>
    <path d="M 88 76 L 56 76 L 46 116"/>
