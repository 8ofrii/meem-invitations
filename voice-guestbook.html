<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEEM • ميم — دفتر التهاني الصوتي والمكتوب | Voice &amp; Wishes Guestbook</title>
  <link rel="icon" type="image/png" href="assets/logos/meem-logo-128.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF7F2;
      --emerald: #0D3B2E;
      --emerald-2: #16503F;
      --gold: #C5A059;
      --gold-dark: #9B7837;
      --ink: #1C2420;
      --muted: #66706A;
      --line: rgba(197, 160, 89, 0.36);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 0%, #FFFDF9 0%, var(--bg) 55%, #EFE8DA 100%);
      color: var(--ink);
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 70px;
    }
    .amiri { font-family: 'Amiri', serif; }
    .shell { max-width: 560px; margin: 0 auto; }
    .top-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }
    .lang-btn {
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: #FFFFFF; color: var(--emerald); font: 700 12px inherit; cursor: pointer;
    }
    .card {
      background: linear-gradient(160deg, #FFFFFF 0%, #FBF6EC 100%);
      border: 1.5px solid var(--line);
      border-radius: 26px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(13, 59, 46, 0.08);
    }
    .logo { width: 58px; height: 58px; object-fit: contain; margin: 0 auto 8px; display: block; }
    .pill {
      display: inline-block; padding: 4px 14px; border-radius: 999px;
      background: rgba(13, 59, 46, 0.07); border: 1px solid var(--line);
      color: var(--emerald); font-size: 11px; font-weight: 700; margin-bottom: 10px;
    }
    h1 { font-size: 36px; color: var(--emerald); line-height: 1.2; }
    .sub { font-size: 13px; color: var(--muted); margin: 8px auto 20px; max-width: 420px; line-height: 1.7; }
    .inp, .txt {
      width: 100%; padding: 11px 14px; border-radius: 14px;
      border: 1px solid rgba(13, 59, 46, 0.18); background: #FFFFFF;
      color: var(--ink); font: inherit; font-size: 13.5px; margin-bottom: 12px; outline: none;
    }
    .inp:focus, .txt:focus { border-color: var(--gold); }
    .rec-box {
      background: #FAF7F2; border: 1.5px dashed var(--gold); border-radius: 20px;
      padding: 20px 16px; margin-bottom: 14px;
    }
    .mic-btn {
      width: 78px; height: 78px; border-radius: 50%; border: 2px solid var(--gold);
      background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
      color: #FAF6EE; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 12px 28px rgba(13, 59, 46, 0.24);
      transition: transform 0.2s;
    }
    .mic-btn:hover { transform: scale(1.05); }
    .mic-btn.is-rec {
      background: #DC2626; border-color: #FCA5A5;
      animation: micPulse 1.1s ease-in-out infinite;
    }
    @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.45); } 50% { box-shadow: 0 0 0 16px rgba(220,38,38,0); } }
    .rec-timer { font-size: 13px; font-weight: 700; color: var(--emerald); margin-top: 10px; }
    .preview-audio { width: 100%; margin-top: 12px; display: none; }
    .btn-send {
      width: 100%; padding: 13px 20px; border-radius: 999px; border: 1px solid var(--gold);
      background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
      color: #FFFFFF; font: 700 13.5px inherit; cursor: pointer;
      box-shadow: 0 10px 24px rgba(13, 59, 46, 0.2);
    }
    .status {
      display: none; margin-top: 14px; padding: 11px 14px; border-radius: 12px;
      background: rgba(13, 59, 46, 0.08); border: 1px solid var(--line);
      color: var(--emerald); font-size: 13px; font-weight: 600;
    }
    .status.show { display: block; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top-row">
      <button type="button" class="lang-btn" id="langBtn">English</button>
    </div>
    <section class="card">
      <img class="logo" src="assets/logos/meem-logo-320.png?v=2" alt="MEEM" />
      <div class="pill" id="gbPill">دفتر التهاني الخاص • Private Voice Guestbook</div>
      <h1 class="amiri" id="gbCouple">كريم و نور</h1>
      <p class="sub" id="gbSub">سجّل رسالة صوتية قصيرة بصوتك أو اكتب تهنئة جميلة للعروسين — تُحفظ بسرية تامة داخل ألبومهم الخاص كذكرى للأبد.</p>

      <input class="inp" id="gName" placeholder="اسمك الكريم (مثال: أحمد)" />
      <textarea class="txt" id="gNote" rows="3" placeholder="اكتب تهنئتك أو دعوة جميلة للعروسين (اختياري)..."></textarea>

      <div class="rec-box">
        <button type="button" class="mic-btn" id="micBtn" aria-label="تسجيل رسالة صوتية">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <div class="rec-timer" id="recLabel">اضغط على الميكروفون لتسجيل رسالة صوتية</div>
        <audio id="audioPreview" class="preview-audio" controls></audio>
      </div>

      <button type="button" class="btn-send" id="sendBtn">إرسال التهنئة لألبوم العروسين</button>
      <div class="status" id="statusBox"></div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const COUPLE = params.get('couple') || 'كريم و نور';
    const ENDPOINT = params.get('endpoint') || '';
    const TOKEN = params.get('token') || '';
    document.getElementById('gbCouple').textContent = COUPLE;

    let mediaStream = null, rec = null, chunks = [], recordedBlob = null, sec = 0, tick = null;
    const micBtn = document.getElementById('micBtn');
    const recLabel = document.getElementById('recLabel');
    const audioEl = document.getElementById('audioPreview');
    const statusBox = document.getElementById('statusBox');

    function showStatus(msg) { statusBox.textContent = msg; statusBox.classList.add('show'); }

    micBtn.addEventListener('click', async () => {
      if (rec && rec.state === 'recording') {
        rec.stop();
        clearInterval(tick);
        micBtn.classList.remove('is-rec');
        recLabel.textContent = isEn ? 'Voice note recorded — preview below' : '✓ تم تسجيل رسالتك الصوتية — يمكنك الاستماع لها بالأسفل';
        return;
      }
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        recordedBlob = null;
        rec = new MediaRecorder(mediaStream);
        rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          recordedBlob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
          audioEl.src = URL.createObjectURL(recordedBlob);
          audioEl.style.display = 'block';
          mediaStream.getTracks().forEach(t => t.stop());
        };
        rec.start();
        sec = 0;
        micBtn.classList.add('is-rec');
        tick = setInterval(() => {
          sec++;
          recLabel.textContent = (isEn ? 'Recording... ' : 'جاري التسجيل... ') + `00:${String(sec).padStart(2, '0')}`;
          if (sec >= 60 && rec.state === 'recording') micBtn.click();
        }, 1000);
      } catch (_) {
        showStatus(isEn ? 'Microphone permission denied — you can still send a written wish.' : 'لم يتم منح إذن الميكروفون — يمكنك إرسال تهنئة مكتوبة بدلاً من ذلك.');
      }
    });

    function blobToDataUrl(b) {
      return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
    }

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const guestName = document.getElementById('gName').value.trim() || 'Guest';
      const note = document.getElementById('gNote').value.trim();
      if (!recordedBlob && !note) {
        showStatus(isEn ? 'Please record a voice note or write a wish first.' : 'يرجى تسجيل رسالة صوتية أو كتابة تهنئة أولاً.');
        return;
      }
      showStatus(isEn ? 'Sending securely to the couple...' : 'جاري إرسال تهنئتك بسرية للعروسين...');

      const payloadBlob = recordedBlob || new Blob([`From: ${guestName}\nWish:\n${note}`], { type: 'text/plain;charset=utf-8' });
      const dataUrl = await blobToDataUrl(payloadBlob);

      if (ENDPOINT) {
        try {
          await fetch(ENDPOINT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ token: TOKEN, base64: dataUrl, mimeType: payloadBlob.type, guestName, note })
          });
          showStatus(isEn ? '✓ Your wish has been saved privately for the couple!' : '✓ تم حفظ رسالتك بسرية تامة داخل ألبوم العروسين الخاص!');
        } catch (_) {
          showStatus(isEn ? 'Network error — please try again.' : 'تعذر الإرسال — برجاء المحاولة مرة أخرى.');
        }
      } else {
        showStatus(isEn ? '✓ Preview ready! In client mode, this saves straight to the couple’s private Google Drive.' : '✓ تم تجهيز الرسالة! عند ربطها بالعميل تُحفظ فوراً في Google Drive الخاص بالعروسين.');
      }
    });

    let isEn = false;
    document.getElementById('langBtn').addEventListener('click', () => {
      isEn = !isEn;
      document.documentElement.dir = isEn ? 'ltr' : 'rtl';
      document.documentElement.lang = isEn ? 'en' : 'ar';
      document.getElementById('langBtn').textContent = isEn ? 'العربية' : 'English';
      document.getElementById('gbSub').textContent = isEn
        ? 'Record a short voice message or write a blessing for the couple — saved privately in their keepsake vault forever.'
        : 'سجّل رسالة صوتية قصيرة بصوتك أو اكتب تهنئة جميلة للعروسين — تُحفظ بسرية تامة داخل ألبومهم الخاص كذكرى للأبد.';
      document.getElementById('gName').placeholder = isEn ? 'Your Name' : 'اسمك الكريم (مثال: أحمد)';
      document.getElementById('gNote').placeholder = isEn ? 'Write a warm blessing for the couple (optional)...' : 'اكتب تهنئتك أو دعوة جميلة للعروسين (اختياري)...';
      document.getElementById('sendBtn').textContent = isEn ? 'Send Private Wish to the Couple' : 'إرسال التهنئة لألبوم العروسين';
      if (!rec || rec.state !== 'recording') recLabel.textContent = isEn ? 'Tap the microphone to record a voice note' : 'اضغط على الميكروفون لتسجيل رسالة صوتية';
    });
  </script>
</body>
</html>
